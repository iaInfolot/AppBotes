<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Botes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@300;400;600;700&display=swap');

:root {
  --pv-primary:   #f0b429;
  --pv-secondary: #e05c2a;
  --bg:       #07090e; --surface:  #0f1319; --card: #131820; --card2: #171e28;
  --border:   #1d2738; --text: #e6ecf3; --text2: #8a9bb0; --muted: #3d4f62;
  --success:  #27c97a; --radius: 14px; --shadow: 0 4px 24px rgba(0,0,0,.45);
  --font-display:'Bebas Neue',sans-serif; --font-ui:'Barlow Condensed',sans-serif; --font-body:'Barlow',sans-serif;
}
body.light {
  --bg:#eef0f4; --surface:#fff; --card:#fff; --card2:#f4f6f9;
  --border:#d8dde6; --text:#111827; --text2:#4b5563; --muted:#9ca3af; --shadow:0 4px 24px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow:hidden;transition:background .3s,color .3s;}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:200;}
#loading-logo{font-family:var(--font-display);font-size:2.8rem;letter-spacing:6px;color:var(--pv-primary);}
#loading-step{font-family:var(--font-ui);font-size:.82rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
.spinner{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--pv-primary);border-radius:50%;animation:spin .7s linear infinite;}

/* APP SHELL */
#app{display:none;width:100vw;height:100vh;flex-direction:column;}
#app.visible{display:flex;}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;padding:8px 24px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface);gap:16px;min-height:58px;max-height:58px;}
.header-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1;}
#pv-logo{height:38px;width:auto;max-width:140px;object-fit:contain;display:none;flex-shrink:0;}
.title-block{min-width:0;}
#pv-name{font-family:var(--font-display);font-size:1.7rem;letter-spacing:3px;color:var(--pv-primary);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#pv-tagline{font-family:var(--font-ui);font-size:.68rem;color:var(--text2);letter-spacing:2px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#pv-tagline span{color:var(--pv-primary);}
.header-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}

/* VIEW SWITCHER — hidden in header, navigation via menu only */
.view-tabs{display:none;}
.view-tab{display:none;}

#clock{display:none;}
#menu-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 16px;border-radius:8px;font-family:var(--font-ui);font-size:.82rem;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:border-color .2s,color .2s;white-space:nowrap;}
#menu-btn:hover{border-color:var(--pv-primary);color:var(--pv-primary);}
.accent-line{height:2px;background:linear-gradient(90deg,var(--pv-primary) 0%,var(--pv-secondary) 40%,transparent 80%);flex-shrink:0;}

/* MAIN CONTENT */
#main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:12px 24px 0;min-height:0;}
.section-label{font-family:var(--font-ui);font-size:.68rem;font-weight:600;letter-spacing:5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;flex-shrink:0;display:flex;align-items:center;gap:8px;}
.section-label::before{content:'';display:inline-block;width:5px;height:5px;background:var(--pv-primary);border-radius:50%;}

/* VIEWS — only one visible at a time */
.view{display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0;} .view.active{display:flex;flex:1;min-height:0;}
.view.active{display:flex;flex:1;min-height:0;}

/* ════════ VIEW 1: JACKPOTS GRID ════════ */
#jackpots-grid{flex:1;display:grid;gap:10px;overflow-y:auto;overflow-x:hidden;padding-bottom:12px;min-height:0;}

.jackpot-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:var(--shadow);animation:fadeUp .35s ease both;transition:transform .2s,box-shadow .2s,border-color .2s;min-height:0;}
.jackpot-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.35);border-color:var(--pv-primary);}
.jackpot-card.is-highest{border-color:var(--pv-primary);box-shadow:0 0 0 2px var(--pv-primary),0 8px 32px rgba(0,0,0,.4);}
.jackpot-card.is-highest::after{content:'★ MAYOR BOTE';position:absolute;top:8px;right:12px;font-family:var(--font-ui);font-size:.6rem;font-weight:700;letter-spacing:2px;color:var(--pv-primary);animation:pulseLabel 2s ease-in-out infinite;}
.jackpot-card.is-next{border-color:var(--pv-secondary);box-shadow:0 0 0 2px var(--pv-secondary),0 8px 32px rgba(0,0,0,.4);}
.jackpot-card.is-next:not(.is-highest)::after{content:'⚡ PRÓXIMO SORTEO';position:absolute;top:8px;right:12px;font-family:var(--font-ui);font-size:.6rem;font-weight:700;letter-spacing:2px;color:var(--pv-secondary);animation:pulseLabel 2s ease-in-out infinite;}
.card-bar{position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--radius) var(--radius) 0 0;}
.card-header{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-shrink:0;}
.card-logo{width:34px;height:34px;object-fit:contain;border-radius:6px;flex-shrink:0;}
.card-name{font-family:var(--font-ui);font-size:1.15rem;font-weight:700;letter-spacing:.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;line-height:1.1;}
.card-amount-wrap{flex:1;display:flex;align-items:center;justify-content:flex-end;min-height:0;padding-right:4px;}
.card-amount{font-family:var(--font-display);letter-spacing:1px;line-height:1;text-align:right;display:flex;flex-direction:column;align-items:flex-end;}
.card-amount-number{display:block;line-height:1;}
.card-currency{font-size:.5em;opacity:.65;margin-right:2px;vertical-align:super;}
.card-amount-label{font-family:var(--font-ui);font-size:.28em;font-weight:700;letter-spacing:4px;opacity:.75;line-height:1.2;text-align:right;}
.card-footer{flex-shrink:0;margin-top:6px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;}
.card-footer-left{display:flex;flex-direction:column;gap:4px;min-width:0;}
.card-date{font-family:var(--font-ui);font-size:.85rem;font-weight:600;color:var(--text2);letter-spacing:.5px;}
.card-addons{display:flex;flex-wrap:wrap;gap:4px;}
.addon-pill{display:flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:3px 9px;font-family:var(--font-ui);font-size:.7rem;}
.addon-name{color:var(--text2);}.addon-amt{color:var(--success);font-weight:700;}
.card-countdown{font-family:var(--font-ui);font-size:.78rem;font-weight:600;letter-spacing:1px;color:var(--text2);text-align:right;white-space:nowrap;flex-shrink:0;}
.card-countdown.urgent{color:var(--pv-secondary);animation:pulseLabel 1s ease-in-out infinite;}
.card-countdown.soon{color:var(--pv-primary);}

/* ════════ VIEW 2: RESULTADOS ════════ */
#results-scroll{flex:1;overflow:hidden;padding-bottom:12px;}
#results-scroll::-webkit-scrollbar{width:4px;}
#results-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* grid of game result blocks */
#results-grid{display:grid;gap:10px;align-items:start;align-content:start;height:100%;overflow:hidden;}

/* one block per game */
.result-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;animation:fadeUp .35s ease both;}
.result-block-header{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--border);}
.result-block-bar{width:3px;height:24px;border-radius:2px;flex-shrink:0;}
.result-block-logo{width:22px;height:22px;object-fit:contain;flex-shrink:0;}
.result-block-name{font-family:var(--font-ui);font-size:.82rem;font-weight:700;letter-spacing:.5px;color:var(--text);flex:1;}
.result-week-label{font-family:var(--font-ui);font-size:.68rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}

/* table of draws */
.result-table{width:100%;border-collapse:collapse;}
.result-table th{font-family:var(--font-ui);font-size:.65rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:6px 14px;text-align:left;border-bottom:1px solid var(--border);background:var(--card2);}
.result-table th.num{text-align:center;}
.result-table td{padding:7px 14px;border-bottom:1px solid var(--border);font-family:var(--font-ui);font-size:.88rem;vertical-align:middle;}
.result-table tr:last-child td{border-bottom:none;}
.result-table tr.pending td{color:var(--muted);}
.result-table tr.has-result td{color:var(--text);}

/* day cell */
td.r-day{font-weight:700;font-size:.8rem;color:var(--text2);width:30px;}
td.r-date{font-size:.78rem;color:var(--muted);width:70px;}

/* number balls */
.balls{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.ball{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-family:var(--font-ui);font-size:.72rem;font-weight:700;flex-shrink:0;}
.ball.main{}
.ball.extra{border-radius:4px;}/* stars/extras as squares */
.ball.comp{border-radius:50%;opacity:.8;}
.ball.refund{border-radius:3px;opacity:.85;}
.ball-sep{color:var(--muted);font-size:.8rem;margin:0 2px;}

/* extra fields (joker code, etc) */
td.r-extra{font-family:var(--font-ui);font-size:.8rem;color:var(--success);}

/* pending game block — slightly dimmed */
.result-block.result-pending{opacity:.7;}
td.r-pending{color:var(--border);font-size:.85rem;text-align:center;}

/* EMPTY STATE */
#empty-state{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:14px;color:var(--muted);}
#empty-state .ei{font-size:3rem;}
#empty-state p{font-family:var(--font-ui);font-size:.85rem;letter-spacing:4px;text-transform:uppercase;}

/* STATUS BAR */
/* status bar moved to header */
#status-bar{display:none;}
#status-msg{display:none;}
.status-right{display:none;}
#last-update,#app-ver{display:none;}

/* OVERLAY */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);z-index:100;align-items:center;justify-content:center;}
#overlay.visible{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:26px 30px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;position:relative;box-shadow:0 24px 64px rgba(0,0,0,.5);}
.modal::-webkit-scrollbar{width:3px;}.modal::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.modal h2{font-family:var(--font-display);font-size:1.6rem;letter-spacing:3px;color:var(--pv-primary);margin-bottom:3px;}
.modal-sub{font-size:.68rem;color:var(--muted);margin-bottom:20px;font-family:var(--font-ui);letter-spacing:3px;text-transform:uppercase;}
.close-btn{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;transition:color .2s;line-height:1;}
.close-btn:hover{color:var(--text);}
.cfg-section{font-family:var(--font-ui);font-size:.68rem;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--pv-primary);margin:16px 0 10px;display:flex;align-items:center;gap:8px;}
.cfg-section::after{content:'';flex:1;height:1px;background:var(--border);}
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-family:var(--font-ui);font-size:.68rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.form-group input,.form-group select{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font-body);font-size:.9rem;padding:8px 12px;outline:none;transition:border-color .2s;appearance:none;}
.form-group input:focus,.form-group select:focus{border-color:var(--pv-primary);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.color-row{display:flex;align-items:center;gap:8px;}
.color-row input[type="color"]{width:40px;height:36px;padding:2px 4px;border-radius:6px;cursor:pointer;flex-shrink:0;}
.color-row input[type="text"]{flex:1;font-family:monospace;font-size:.85rem;}
.modal-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}
.btn{font-family:var(--font-ui);font-size:.85rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;border:none;border-radius:8px;padding:9px 18px;cursor:pointer;transition:opacity .2s,transform .1s;white-space:nowrap;}
.btn:hover{opacity:.85;}.btn:active{transform:scale(.97);}
.btn-primary{background:var(--pv-primary);color:#000;}
.btn-secondary{background:var(--card);border:1px solid var(--border);color:var(--text);}
.btn-danger{background:#b03020;color:#fff;margin-left:auto;}
.menu-list{list-style:none;display:flex;flex-direction:column;gap:7px;margin-bottom:20px;}
.menu-list li button{width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px 16px;font-family:var(--font-ui);font-size:1rem;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:border-color .2s,color .2s;}
.menu-list li button:hover{border-color:var(--pv-primary);color:var(--pv-primary);}
.menu-icon{font-size:1.1rem;width:24px;text-align:center;}
.app-version{font-size:.65rem;color:var(--muted);font-family:var(--font-ui);letter-spacing:1px;}
#diag-output{background:#050709;border:1px solid var(--border);border-radius:8px;padding:12px;font-family:'Courier New',monospace;font-size:.7rem;line-height:1.6;color:#8ab4c8;max-height:50vh;overflow-y:auto;white-space:pre-wrap;word-break:break-all;}

/* MIXED VIEW */
#view-mixed {
  display:none;
  flex-direction:row;
  overflow:hidden;
  gap:10px;
  padding:0 24px 12px;
}
#view-mixed.active { display:flex; }
#mixed-jackpots {
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  min-height:0;
  min-width:0;
}
#mixed-results {
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  min-height:0;
  min-width:0;
}
.mixed-label {
  font-family:var(--font-ui);
  font-size:.65rem;
  font-weight:600;
  letter-spacing:4px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:8px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:6px;
}
.mixed-label::before { content:''; display:inline-block; width:4px; height:4px; background:var(--pv-primary); border-radius:50%; }
#mixed-jackpots-grid {
  flex:1;
  display:grid;
  gap:8px;
  overflow:hidden;
  min-height:0;
}
#mixed-results-scroll {
  flex:1;
  overflow-y:auto;
  min-height:0;
}
#mixed-results-grid {
  display:grid;
  gap:8px;
  align-content:start;
}

/* VERTICAL */
body.orient-v header{padding:8px 16px;min-height:54px;}
body.orient-v #pv-name{font-size:1.4rem;}
body.orient-v #clock{font-size:1.2rem;}
body.orient-v #main-content{padding:10px 14px 0;}
body.orient-v #status-bar{padding:5px 14px;}
body.orient-v .view-tabs{display:none;}

/* D-PAD FOCUS STYLES — TV Remote Navigation */
button:focus, select:focus, input:focus, [tabindex]:focus {
  outline: 4px solid var(--pv-primary) !important;
  outline-offset: 3px;
  box-shadow: 0 0 0 6px rgba(240,180,41,0.25) !important;
}
.view-tab:focus {
  background: var(--pv-primary) !important;
  color: #000 !important;
}
.menu-list li button:focus {
  border-color: var(--pv-primary) !important;
  color: var(--pv-primary) !important;
  background: var(--card2) !important;
}
.btn:focus {
  outline: 4px solid var(--pv-primary) !important;
  box-shadow: 0 0 0 6px rgba(240,180,41,0.25) !important;
  transform: scale(1.03);
}
.form-group input:focus, .form-group select:focus {
  border-color: var(--pv-primary) !important;
  box-shadow: 0 0 0 3px rgba(240,180,41,0.3) !important;
}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseLabel{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body class="orient-h">

<div id="loading">
  <div id="loading-logo">Botes</div>
  <div class="spinner"></div>
  <div id="loading-step">Iniciando...</div>
</div>

<div id="app">
  <header>
    <div class="header-left">
      <img id="pv-logo" src="" alt="">
      <div class="title-block">
        <div id="pv-name" style="display:none">—</div>
        <div id="pv-tagline"><span id="pv-url"></span></div>
      </div>
      <div id="section-label-header" style="font-family:var(--font-ui);font-size:.62rem;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;padding-left:20px;border-left:1px solid var(--border);margin-left:8px;white-space:nowrap;display:none">
        <span style="display:inline-block;width:5px;height:5px;background:var(--pv-primary);border-radius:50%;flex-shrink:0"></span>
        <span id="section-label-text"></span>
      </div>
    </div>
    <div class="header-right">
      <!-- View tabs kept in DOM (hidden) for JS compatibility -->
      <div class="view-tabs">
        <button class="view-tab active" id="tab-jackpots" onclick="switchView('jackpots')"></button>
        <button class="view-tab" id="tab-results"  onclick="switchView('results')"></button>
        <button class="view-tab" id="tab-mixed"    onclick="switchView('mixed')"></button>
      </div>
      <div id="header-meta" style="display:flex;flex-direction:column;align-items:flex-end;gap:1px;">
        <span id="last-update" style="font-family:var(--font-ui);font-size:.6rem;color:var(--muted);letter-spacing:1px;white-space:nowrap"></span>
        <span id="app-ver" style="font-family:var(--font-ui);font-size:.58rem;color:var(--muted);opacity:.6;letter-spacing:1px;white-space:nowrap"></span>
      </div>
      <span id="status-msg" style="font-family:var(--font-ui);font-size:.65rem;color:var(--muted);letter-spacing:1px;white-space:nowrap"></span>
      <div id="clock">--:--</div>
      <button id="menu-btn" onclick="openMenu()">☰ Menú</button>
    </div>
  </header>
  <div class="accent-line"></div>

  <div id="main-content">
    <!-- section-label moved to header -->
    <!-- VIEW 1: JACKPOTS -->
    <div class="view active" id="view-jackpots" style="flex:1;min-height:0;">
      <div id="jackpots-grid"></div>
      <div id="empty-state">
        <div class="ei">🎰</div>
        <p>No hay botes disponibles</p>
      </div>
    </div>

    <!-- VIEW 3: MIXED -->
    <div class="view" id="view-mixed">
      <div id="mixed-jackpots">
        <div class="mixed-label">Próximos Botes</div>
        <div id="mixed-jackpots-grid"></div>
      </div>
      <div id="mixed-results">
        <div class="mixed-label">Resultados</div>
        <div id="mixed-results-scroll"><div id="mixed-results-grid"></div></div>
      </div>
    </div>

    <!-- VIEW 2: RESULTS -->
    <div class="view" id="view-results">
      <div id="results-scroll" style="height:100%;overflow:hidden">
        <div id="results-grid" style="height:100%"></div>
      </div>
    </div>
  </div>

  <div id="status-bar">
    <span id="status-msg">Listo</span>
    <div class="status-right">
      <span id="last-update"></span>
      <span id="app-ver"></span>
    </div>
  </div>
</div>

<div id="overlay">

  <div class="modal" id="modal-menu">
    <button class="close-btn" onclick="closeOverlay()">✕</button>
    <h2>Menú</h2>
    <div class="modal-sub">Navegación</div>
    <ul class="menu-list">
      <li><button onclick="switchView('jackpots');closeOverlay()"><span class="menu-icon">🏆</span>Botes</button></li>
      <li><button onclick="switchView('results');closeOverlay()"><span class="menu-icon">📋</span>Resultados</button></li>
      <li><button onclick="switchView('mixed');closeOverlay()"><span class="menu-icon">⊞</span>Vista Mixta</button></li>
      <li><button onclick="showConfig()"><span class="menu-icon">⚙️</span>Configuración</button></li>
      <li><button onclick="manualRefresh()"><span class="menu-icon">🔄</span>Actualizar datos</button></li>
    </ul>
    <div class="app-version" id="menu-version"></div>
  </div>

  <div class="modal" id="modal-config" style="display:none;width:580px;">
    <button class="close-btn" onclick="closeOverlay()">✕</button>
    <h2>Configuración</h2>

// ── WS CALL ──────────────────────────
async function wsCall(endpoint,extra={}){
  const cfg=loadConfig();
  const url=`${cfg.url}/ws/${endpoint}`;
  const body={token:cfg.token,pass:cfg.pass,app_id:cfg.appid,...extra};
  console.log('[wsCall]',endpoint,'->',url);
  const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!resp.ok)throw new Error(`HTTP ${resp.status}`);
  const json=await resp.json();
  if(json.error)throw new Error(json.error);
  return json.data;
}

// ── LAST-RESULTS ──────────────────────
async function fetchResults(){
  setStatus('Actualizando resultados...','');
  try{
    const ref  = getResultsWeekRef();
    const {mon,sun} = getWeekBounds(ref);
    const monStr = toYMD(mon), sunStr = toYMD(sun);

    // One call per LAE game — limit 7 to cover the full week
    const gameIds = Object.keys(gamesMap);
    if(!gameIds.length){ setStatus('Sin juegos','error'); return; }

    console.log('[Results] ref:',toYMD(ref),'mon:',monStr,'sun:',sunStr,'today:',toYMD(new Date()));
    setLoadingStep('Cargando resultados semana...');
    const calls = gameIds.map(id => wsCall('last-game-results',{id_game:parseInt(id),limit:7})
      .then(d => Array.isArray(d)?d:[])
      .catch(()=>[]));
    const results = await Promise.all(calls);

    // Flatten and filter to current week only
    // Also accept today's date (lunes) as it may have a new result
    const todayStr = toYMD(new Date());
    const flat = [];
    results.forEach((gameResults,idx)=>{
      const id = parseInt(gameIds[idx]);
      gameResults.forEach(r=>{
        // Include if in week range OR is today
        if(r.date && (r.date>=monStr && r.date<=sunStr || r.date===todayStr)){
          flat.push({...r, id_game:id});
        }
      });
    });
    console.log('[Results] week:',monStr,'→',sunStr,'today:',todayStr,'flat:',flat.length,'sample:',flat.slice(0,3).map(r=>r.id_game+':'+r.date));

    lastResultsData = flat;

    }
    setStatus('Datos actualizados','ok');
  }catch(e){
    console.error('[Results] fetchResults failed:',e);
    setStatus('Error resultados: '+e.message,'error');
  }
}

// ── WEEK HELPERS ──────────────────────
function getWeekBounds(refDate){
  // Week: Mon–Sun. Returns {mon, sun} as Date objects
  const d=new Date(refDate);
  const day=d.getDay(); // 0=Sun
  const diffToMon=day===0?-6:1-day;
  const mon=new Date(d);mon.setDate(d.getDate()+diffToMon);mon.setHours(0,0,0,0);
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);sun.setHours(23,59,59,999);
  return {mon,sun};
}

function toYMD(d){
  // Use local date parts to avoid UTC offset shifting the day
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}

function isCurrentWeekResults(){
  // On Mondays before first draw (~14:00), show previous week
  const now=new Date();
  if(now.getDay()===1 && now.getHours()<14) return false;
  return true;
}

function getResultsWeekRef(){
  // DEBUG: force previous week to test with full data
  const now=new Date();
  const prev=new Date(now);
  prev.setDate(now.getDate()-7);
  return prev;
}

function resultsWeekLabel(){
  const ref=getResultsWeekRef();
  const {mon,sun}=getWeekBounds(ref);
  const fmt=d=>d.toLocaleDateString('es-ES',{day:'numeric',month:'short'});
  const wk=getISOWeek(ref);
  return `Resultados Semana ${wk} · ${fmt(mon)} – ${fmt(sun)}`;
}

function getISOWeek(d){
  const date=new Date(d);
  date.setHours(0,0,0,0);
  date.setDate(date.getDate()+3-(date.getDay()+6)%7);
  const week1=new Date(date.getFullYear(),0,4);
  return 1+Math.round(((date-week1)/86400000-3+(week1.getDay()+6)%7)/7);
}

// ── RENDER JACKPOTS ───────────────────
function renderJackpots(data){
  countdownTimers.forEach(clearInterval);countdownTimers=[];
  const grid=document.getElementById('jackpots-grid');
  const empty=document.getElementById('empty-state');
  grid.innerHTML='';
  console.log('[Jackpots] data:',data.length,'gamesMap keys:',Object.keys(gamesMap).length);
  const items=data.filter(item=>!Object.keys(gamesMap).length||gamesMap[item.id_game]);
  console.log('[Jackpots] items after filter:',items.length);
  if(!items.length){grid.style.display='none';empty.style.display='flex';return;}
  grid.style.display='';empty.style.display='none';
  console.log('[Render] Rendering',items.length,'cards into grid');
  const maxJ=Math.max(...items.map(i=>parseFloat(i.jackpot)||0));
  const minDate=items.reduce((m,i)=>(!i.date?m:(!m||i.date<m?i.date:m)),null);
  const isV=document.body.classList.contains('orient-v');
  const n=items.length;let cols,rows;
  if(isV){cols=1;rows=n;}
  else{
    if(n<=2){cols=n;rows=1;}else if(n<=4){cols=2;rows=Math.ceil(n/2);}
    else if(n<=6){cols=3;rows=Math.ceil(n/3);}else if(n<=8){cols=4;rows=Math.ceil(n/4);}
    else if(n<=9){cols=3;rows=3;}else{cols=4;rows=Math.ceil(n/4);}
  }
  grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  grid.style.gridTemplateRows=`repeat(${rows},1fr)`;
  items.forEach((item,i)=>{
    const game=gamesMap[item.id_game]||{};
    const barClr=game.bg_color||'var(--pv-primary)';
    // Always use game jackpot color; fallback to pv-primary
    const rawAmtClr=game.jackpot_fg_color||'';
    const amtClr = (rawAmtClr&&rawAmtClr!=='#000000'&&rawAmtClr!=='#FFFFFF'&&rawAmtClr!=='#ffffff'&&rawAmtClr!=='#000')
      ? rawAmtClr : 'var(--pv-primary)';
    const jackpot=parseFloat(item.jackpot)||0;
    const isHighest=jackpot>0&&jackpot===maxJ;
    const isNext=item.date&&item.date===minDate;
    let logoSrc='';
    if(game.logo_official)logoSrc=game.logo_official.startsWith('http')?game.logo_official:LOGO_BASE+game.logo_official;
    else if(game.logo)logoSrc=game.logo.startsWith('http')?game.logo:LOGO_BASE+game.logo;
    const dateStr=item.date?new Date(item.date+'T00:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}):'';
    // Format amount: millions label or euros label
    const millones = jackpot / 1000000;
    let amountHtml;
    if(jackpot >= 1000000){
      const milStr = Number.isInteger(millones) ? millones.toString() : millones.toFixed(1).replace('.',',');
      const label = millones === 1 ? 'MILLÓN DE EUROS' : 'MILLONES DE EUROS';
      amountHtml = `<span class="card-amount-number">${milStr}</span><span class="card-amount-label">${label}</span>`;
    } else {
      const eurosStr = Math.floor(jackpot).toLocaleString('es-ES');
      amountHtml = `<span class="card-amount-number">${eurosStr}</span><span class="card-amount-label">EUROS</span>`;
    }
    let addonsHtml='';
    if(item.addons&&item.addons.length){
      addonsHtml='<div class="card-addons">'+item.addons.map(a=>{
        const aAmt=Math.floor(parseFloat(a.jackpot)||0).toLocaleString('es-ES');
        return `<div class="addon-pill"><span class="addon-name">${esc(a.name)}</span><span class="addon-amt">+ ${aAmt} €</span></div>`;
      }).join('')+'</div>';
    }
    const cdId=`cd-${i}`;
    const card=document.createElement('div');
    card.className='jackpot-card'+(isHighest?' is-highest':'')+(isNext?' is-next':'');
    card.style.animationDelay=`${i*45}ms`;
    card.innerHTML=`
      <div class="card-bar" style="background:${barClr}"></div>
      <div class="card-header">
        ${logoSrc?`<img class="card-logo" src="${esc(logoSrc)}" alt="" onerror="hideImg(this)">` :''}
        <div class="card-name">${esc(item.name||game.name||'—')}</div>
      </div>
      <div class="card-amount-wrap">
        <div class="card-amount" style="color:${amtClr}">${amountHtml}</div>
      </div>
      <div class="card-footer">
        <div class="card-footer-left">
          ${dateStr?`<div class="card-date">${dateStr}</div>`:''}
          ${addonsHtml}
        </div>
        <div class="card-countdown" id="${cdId}"></div>
      </div>`;
    grid.appendChild(card);
    if(item.date)startCountdown(cdId,item.date,game);
  });
  setTimeout(()=>fitAmountFonts(), 100);
}

// ── RENDER RESULTS ────────────────────
function renderResultsInto(data, grid, forceVertical){ return _renderResults(data, grid, forceVertical); }
function renderResults(data){ _renderResults(data, document.getElementById('results-grid'), false); }
function _renderResults(data, grid, forceVertical){
  grid.innerHTML='';

  // Show full week structure from gamesMap (with or without results)
  function getGameType(game){
    // LotoTurf (id=21) has is_link_match=1 in some configs but is a number game
    if(game.id===21) return 'loto';
    if(game.is_link_match===1) return 'match';
    if(game.is_num_serie===1||game.is_num_fraction===1) return 'nacional';
    return 'loto';
  }

  const isV = forceVertical || document.body.classList.contains('orient-v');

  // Group results by game, sort by date asc
  const byGame={};
  (data||[]).forEach(r=>{
    if(!gamesMap[r.id_game]) return;
    if(!byGame[r.id_game]) byGame[r.id_game]=[];
    byGame[r.id_game].push(r);
  });
  Object.values(byGame).forEach(arr=>arr.sort((a,b)=>a.date>b.date?1:-1));

  // FIXED LAYOUT: populate from gamesMap so columns always appear
  const COL_MAP = {1:1, 3:1, 43:1, 2:2, 5:2, 4:3, 25:4, 26:4, 7:'b', 21:'b'};
  const COL_ORDER = {'1':[1,3,43], '2':[2,5], '3':[4], '4':[25,26], 'b':[7,21]};
  const cols = {'1':[], '2':[], '3':[], '4':[], 'b':[]};
  Object.keys(COL_ORDER).forEach(col=>{
    COL_ORDER[col].forEach(id=>{ if(gamesMap[id]) cols[col].push(id); });
  });
  // Unknown games from gamesMap go to col 1
  Object.keys(gamesMap).forEach(id=>{
    const iid=parseInt(id);
    if(COL_MAP[iid]===undefined && !cols['1'].includes(iid)) cols['1'].push(iid);
  });

  // Ball rendering — size computed per-game so all rows within same block are equal
  // colBodyW: approximate inner width of a result block body (px)
  // We compute it once from screen width; fallback 280px
  // col body width: (screenW - col4_fixed - gaps) / 3 - block_padding
  // col4=210px, 4 gaps of 8px between cols + 2*8px outer = 56px total gaps
  // block padding = 2*8px = 16px
  const colBodyW = Math.max(200, Math.round((window.innerWidth - 210 - 56) / 3) - 16);

  function calcBSZ(numMain, numExtra, numComp, numRefund){
    const totalBalls = numMain + numExtra + numComp + numRefund;
    const seps = (numExtra>0?1:0) + (numComp>0?1:0) + (numRefund>0?1:0);
    const sepW = seps * 12;
    const available = colBodyW - sepW - (totalBalls-1)*2;
    const sz = Math.floor(available / Math.max(totalBalls,1));
    return Math.min(40, Math.max(22, sz));
  }

  function makeBall(n, bg, fg, shape, sz){
    const br = shape==='sq'?'4px':'50%';
    const fs = sz >= 34 ? '.82rem' : sz >= 28 ? '.72rem' : sz >= 24 ? '.64rem' : '.56rem';
    return `<span style="display:inline-flex;align-items:center;justify-content:center;`+
      `width:${sz}px;height:${sz}px;background:${bg};color:${fg};border-radius:${br};`+
      `font-family:var(--font-ui);font-size:${fs};font-weight:700;flex-shrink:0;">${n}</span>`;
  }
  // Legacy ball() uses default size 26 (for pending placeholders etc.)
  function ball(n,bg,fg,shape){ return makeBall(n,bg,fg,shape,26); }
  function ballsWithSize(arr, bg, fg, shape, sz){
    if(!arr) return '';
    const vals=Array.isArray(arr)?arr:Object.values(arr);
    return vals.map(n=>makeBall(n,bg,fg,shape,sz)).join('');
  }
  function balls(arr,bg,fg,shape){ return ballsWithSize(arr,bg,fg,shape,26); }
  function ballSep(label){
    return `<span style="font-family:var(--font-ui);font-size:.54rem;color:var(--text2);margin:0 2px;flex-shrink:0;line-height:1;font-weight:600;opacity:.8">${label}</span>`;
  }
  function ballRow(html){
    return `<div class="ball-row" style="display:flex;flex-wrap:nowrap;align-items:center;gap:2px;width:100%">${html}</div>`;
  }

  // Pending placeholder (ghost balls)
  function pendingHtml(game){
    const gt=getGameType(game);
    if(gt==='match'){
      const n=game.num_events||15;
      const rPad=n>14?'1px 0':'2px 0';
      let h='<div style="opacity:.22">';
      for(let i=0;i<Math.min(n,15);i++)
        h+=`<div style="display:flex;align-items:center;justify-content:space-between;gap:3px;padding:${rPad};border-bottom:1px solid var(--border)">
          <div style="height:8px;background:var(--border);border-radius:3px;flex:1"></div>
          <span style="background:var(--border);color:transparent;border-radius:3px;padding:1px 5px;font-size:.58rem">·</span></div>`;
      return h+'</div>';
    }
    const nb=game.num_bet_per_game||6, ne=game.num_extra_per_bet||0;
    let r='';
    for(let i=0;i<nb;i++) r+=ball('·','var(--muted)','transparent','circle');
    if(ne>0){ r+=ballSep('+'); for(let i=0;i<ne;i++) r+=ball('·','var(--muted)','transparent','sq'); }
    return `<div style="font-family:var(--font-ui);font-size:.7rem;color:var(--muted);font-style:italic;margin-bottom:3px">Pendiente</div>`+
      `<div style="opacity:.22">${ballRow(r)}</div>`;
  }

  function buildBlockHTML(gameId, draws){
    const game=gamesMap[gameId]||{};
    const gt=getGameType(game);
    const barClr=game.bg_color||'var(--pv-primary)';
    // Main balls: bg_color is the game brand color, fallback to number_bg_color, then dark default
    const numBg=(game.bg_color&&game.bg_color!=='#ffffff'&&game.bg_color!=='#FFFFFF')?game.bg_color:(game.number_bg_color||'#1a2535');
    const numFg=game.number_fg_color||'#fff';
    const extBg=game.extra_bg_color||'#c8a000', extFg=game.extra_fg_color||'#000';
    const compBg=game.num_complementary_bg_color||'#e08020', compFg=game.num_complementary_fg_color||'#fff';
    const refBg=game.num_refund_bg_color||'#607080', refFg=game.num_refund_fg_color||'#fff';
    let logoSrc='';
    if(game.logo_official) logoSrc=game.logo_official.startsWith('http')?game.logo_official:LOGO_BASE+game.logo_official;
    else if(game.logo) logoSrc=game.logo.startsWith('http')?game.logo:LOGO_BASE+game.logo;

    let bodyHtml='';

    if(!draws||!draws.length){
      bodyHtml=pendingHtml(game);
    } else if(gt==='loto'){
      const hasE=game.num_extra_per_bet>0, hasC=game.is_num_complementary===1;
      const hasR=game.is_num_refund===1, hasCA=game.is_code_a===1;
      // Compute fixed ball size for this game (same for ALL draws)
      const nMain=game.num_bet_per_game||6;
      const nExtra=hasE?(game.num_extra_per_bet||0):0;
      const nComp=hasC?1:0;
      const nRef=hasR?1:0;
      const bsz=calcBSZ(nMain, nExtra, nComp, nRef);
      draws.forEach((r,ri)=>{
        const d=new Date(r.date+'T12:00:00');
        const fd=d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
        let row=ballsWithSize(r.bet,numBg,numFg,'circle',bsz);
        if(hasE) row+=ballSep('+')+ballsWithSize(r.extra,extBg,extFg,'sq',bsz);
        if(hasC&&r.other?.complementary?.length) row+=ballSep('C')+ballsWithSize(r.other.complementary,compBg,compFg,'circle',bsz);
        if(hasR&&r.other?.refund!=null) row+=ballSep('R')+makeBall(r.other.refund,refBg,refFg,'sq',bsz);
        // code_a label: use game.code_a_name if available, else generic
        const codeALabel=game.code_a_name||'Código';
        const codeAHtml=hasCA&&r.other?.code_a?.length
          ?`<span style="display:inline-flex;align-items:center;gap:4px;font-family:var(--font-ui);font-size:.6rem;font-weight:600;background:rgba(39,201,122,.12);border:1px solid rgba(39,201,122,.3);border-radius:4px;padding:1px 6px;white-space:nowrap">
              <span style="color:var(--muted);letter-spacing:.5px;text-transform:uppercase">${esc(codeALabel)}</span>
              <span style="color:var(--success);letter-spacing:1px">${esc(r.other.code_a[0])}</span>
            </span>`:'';
        const ds=ri<draws.length-1?'border-bottom:1px solid var(--border);margin-bottom:5px;padding-bottom:5px;':'';
        // Header row: date left, code_a right — using absolute positioning
        // so the ball row always occupies 100% width regardless of code_a presence
        bodyHtml+=`<div style="${ds};position:relative">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;min-height:18px">
            <span style="font-family:var(--font-ui);font-size:.72rem;font-weight:600;color:var(--text2)">${esc(fd)}</span>
            ${codeAHtml}
          </div>
          ${ballRow(row)}</div>`;
      });
    } else if(gt==='match'){
      const r=draws[draws.length-1]||{};
      const betArr=Array.isArray(r.bet)?r.bet:[];
      const matches=r.other?.matches||[];
      const fd=new Date(r.date+'T12:00:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
      // Pleno al 15: r.extra = [result, num_acertados]
      const plenoArr=Array.isArray(r.extra)?r.extra:[];
      const plenoRes=plenoArr[0]||null;   // 'M','1','2'
      const plenoAc=plenoArr[1]||null;    // number of acertados
      bodyHtml+=`<div style="font-family:var(--font-ui);font-size:.7rem;color:var(--muted);margin-bottom:3px">${esc(fd)}</div>`;
      // Compute font size to fit all rows without overflow
      // 15 matches × ~18px row = 270px; if block is shorter, shrink
      const rowCount=betArr.length||15;
      const rowFs=rowCount>14?'.58rem':rowCount>10?'.62rem':'.68rem';
      const rowPad=rowCount>14?'1px 0':'2px 0';
      betArr.forEach((res,idx)=>{
        const m=matches.find(x=>parseInt(x.position)===idx+1)||{};
        const t1=m.team_1_name?esc(m.team_1_name):`Eq${idx*2+1}`;
        const t2=m.team_2_name?esc(m.team_2_name):`Eq${idx*2+2}`;
        const rc=res==='1'?'#2563eb':res==='2'?'#dc2626':res.startsWith('M')?'#16a34a':'#ca8a04';
        const ds=idx<betArr.length-1?'border-bottom:1px solid var(--border)':'';
        bodyHtml+=`<div style="display:flex;align-items:center;justify-content:space-between;gap:3px;padding:${rowPad};${ds}">
          <div style="font-family:var(--font-ui);font-size:${rowFs};color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0">${t1} <span style="color:var(--muted)">-</span> ${t2}</div>
          <span style="background:${rc};color:#fff;border-radius:3px;padding:1px 5px;font-family:var(--font-ui);font-size:${rowFs};font-weight:700;flex-shrink:0">${esc(res)}</span></div>`;
      });
      // Pleno al 15
      if(plenoRes!==null){
        const prc=plenoRes==='1'?'#2563eb':plenoRes==='2'?'#dc2626':'#16a34a';
        bodyHtml+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px;padding-top:4px;border-top:1px solid var(--border)">
          <span style="font-family:var(--font-ui);font-size:.6rem;font-weight:600;letter-spacing:.5px;color:var(--text2)">Pleno al 15</span>
          <div style="display:flex;align-items:center;gap:4px">
            ${plenoAc!==null?`<span style="font-family:var(--font-ui);font-size:.6rem;color:var(--muted)">${esc(plenoAc)} ac.</span>`:''}
            <span style="background:${prc};color:#fff;border-radius:3px;padding:1px 6px;font-family:var(--font-ui);font-size:.62rem;font-weight:700">${esc(plenoRes)}</span>
          </div>
        </div>`;
      }
    } else if(gt==='nacional'){
      function fmtPrize(v){
        if(v>=1000000) return (v/1000000).toFixed(v%1000000===0?0:1).replace('.',',')+' M€';
        if(v>=1000) return Math.round(v/1000)+'K€';
        return v+'€';
      }
      // Two draws side by side
      bodyHtml+=`<div style="display:flex;gap:8px;height:100%">`;
      draws.forEach((r,ri)=>{
        const d=new Date(r.date+'T12:00:00');
        const fd=d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
        const betObj=r.bet&&!Array.isArray(r.bet)?r.bet:{P1:r.bet};
        const refunds=Array.isArray(r.other?.num_refund)?r.other.num_refund:
                      (r.other?.num_refund!=null?[r.other.num_refund]:[]);
        const wins=r.winnings||{};
        const topW=Object.values(wins)
          .sort((a,b)=>(a.order||99)-(b.order||99))
          .filter(w=>w.prize>0).slice(0,3);
        const ds=ri<draws.length-1?'border-right:1px solid var(--border);padding-right:8px;':'';
        bodyHtml+=`<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;${ds}">`;

        // Date
        bodyHtml+=`<div style="font-family:var(--font-ui);font-size:.68rem;font-weight:600;color:var(--text2)">${esc(fd)}</div>`;

        // Single row: premios label + numbers + | + reint label + reint balls
        bodyHtml+=`<div style="display:flex;align-items:center;gap:5px;flex-wrap:nowrap">`;
        // Numbers with ordinal labels above
        const numEntries=[];
        Object.keys(betObj).forEach((key,ki)=>{
          const nums=Array.isArray(betObj[key])?betObj[key]:[betObj[key]];
          nums.forEach((n,ni)=>{
            const ord=ki===0&&ni===0?'1º':ki===0&&ni===1?'2º':ki===1?'2º':'';
            numEntries.push({ord,n});
          });
        });
        numEntries.forEach(({ord,n},idx)=>{
          bodyHtml+=`<div style="text-align:center;flex-shrink:0">
            <div style="font-family:var(--font-ui);font-size:.5rem;color:var(--text2);text-align:center;margin-bottom:1px;font-weight:600">${ord} Premio</div>
            <div style="background:${numBg};color:${numFg};border-radius:5px;padding:2px 7px;font-family:var(--font-display);font-size:.88rem;letter-spacing:2px;white-space:nowrap">${esc(n)}</div>
          </div>`;
          if(idx<numEntries.length-1&&refunds.length)
            bodyHtml+=`<div style="width:1px;height:28px;background:var(--border);flex-shrink:0;margin:0 2px"></div>`;
        });
        // Reintegros
        if(refunds.length){
          bodyHtml+=`<div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0">
            <div style="font-family:var(--font-ui);font-size:.5rem;color:var(--text2);margin-bottom:2px;font-weight:600">Reint.</div>
            <div style="display:flex;gap:2px">`;
          refunds.forEach(rv=>{
            bodyHtml+=`<span style="display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:${refBg};color:${refFg};border-radius:3px;font-family:var(--font-ui);font-size:.6rem;font-weight:700">${esc(rv)}</span>`;
          });
          bodyHtml+=`</div></div>`;
        }
        bodyHtml+=`</div>`; // single row

        bodyHtml+=`</div>`; // sorteo column
      });
      bodyHtml+=`</div>`; // flex row
    }
    return {barClr, logoSrc, name:game.name||'Juego '+gameId, bodyHtml};
  }

  function makeBlock(gameId, draws){
    const {barClr,logoSrc,name,bodyHtml}=buildBlockHTML(gameId, draws||[]);
    const hasPending=!draws||!draws.length;
    const block=document.createElement('div');
    block.className='result-block'+(hasPending?' result-pending':'');
    block.style.cssText='overflow:hidden;display:flex;flex-direction:column;border-radius:var(--radius);';
    block.innerHTML=`
      <div class="result-block-header" style="flex-shrink:0">
        <div class="result-block-bar" style="background:${barClr}"></div>
        ${logoSrc?`<img class="result-block-logo" src="${esc(logoSrc)}" alt="" onerror="hideImg(this)">` :''}
        <div class="result-block-name">${esc(name)}</div>
        ${hasPending?`<span style="font-family:var(--font-ui);font-size:.58rem;letter-spacing:1px;color:var(--muted);margin-left:auto;opacity:.6">PENDIENTE</span>`:''}
      </div>
      <div class="rb-body" style="padding:5px 8px;overflow:hidden;flex:1;min-height:0">${bodyHtml}</div>`;
    return block;
  }

  if(isV){
    grid.style.cssText='display:flex;flex-direction:column;gap:6px;overflow:hidden;height:100%';
    [...cols['1'],...cols['2'],...cols['3'],...cols['4'],...cols['b']].forEach(id=>{
      const b=makeBlock(id,byGame[id]); b.style.flex='1'; b.style.minHeight='0'; grid.appendChild(b);
    });
    return;
  }

  // Horizontal layout: 4 cols, bottom strip for Nacional+LotoTurf
  // Layout:
  //  Col1: Euromillón+EuroDreams  Col2: Primitiva+ElGordo  Col3: Bonoloto+LotoTurf  Col4: Quiniela+QuiniGol (full height)
  //  Row2: Nacional spans cols 1-2
  grid.style.cssText='display:grid;grid-template-columns:1fr 1fr 1fr 210px;grid-template-rows:1fr auto;gap:8px;height:100%;overflow:hidden;box-sizing:border-box;';

  function colWrap(gcol, grow){
    const d=document.createElement('div');
    d.style.cssText=`display:flex;flex-direction:column;gap:8px;grid-column:${gcol};grid-row:${grow};overflow:hidden;min-height:0;`;
    return d;
  }

  const c1=colWrap('1','1'); grid.appendChild(c1);
  cols['1'].forEach(id=>{ const b=makeBlock(id,byGame[id]); b.style.flex='1'; b.style.minHeight='0'; c1.appendChild(b); });

  const c2=colWrap('2','1'); grid.appendChild(c2);
  cols['2'].forEach(id=>{ const b=makeBlock(id,byGame[id]); b.style.flex='1'; b.style.minHeight='0'; c2.appendChild(b); });

  // Col 3: Bonoloto (top) + LotoTurf (bottom)
  const c3=colWrap('3','1'); grid.appendChild(c3);
  cols['3'].forEach(id=>{ const b=makeBlock(id,byGame[id]); b.style.flex='1'; b.style.minHeight='0'; c3.appendChild(b); });
  const ltId=cols['b'].find(id=>id===21);
  if(ltId!=null){
    const bl=makeBlock(ltId,byGame[ltId]);
    bl.style.flex='1'; bl.style.minHeight='0';
    c3.appendChild(bl);
  }

  // Col 4: Quiniela+QuiniGol merged block — full height rows 1+2
  const c4=colWrap('4','1/3'); grid.appendChild(c4);
  const quiBlock=makeQuinielaQuiniGolBlock(byGame[25]||[], byGame[26]||[]);
  quiBlock.style.flex='1'; quiBlock.style.minHeight='0';
  c4.appendChild(quiBlock);

  // Row 2: Nacional spans cols 1-2 only
  const nacId=cols['b'].find(id=>id===7);
  if(nacId!=null){
    const bn=makeBlock(nacId,byGame[nacId]);
    bn.style.cssText='grid-column:1/3;grid-row:2;overflow:hidden;min-height:0;max-height:120px;';
    grid.appendChild(bn);
  }
}


// ── QUINIELA + QUINIGOL MERGED BLOCK ─────────────────────────────────────
function makeQuinielaQuiniGolBlock(quiDraws, qgDraws){
  const gameQui=gamesMap[25]||{};
  const gameQG=gamesMap[26]||{};
  let logoSrcQui='', logoSrcQG='';
  if(gameQui.logo_official) logoSrcQui=gameQui.logo_official.startsWith('http')?gameQui.logo_official:LOGO_BASE+gameQui.logo_official;
  else if(gameQui.logo) logoSrcQui=gameQui.logo.startsWith('http')?gameQui.logo:LOGO_BASE+gameQui.logo;
  if(gameQG.logo_official) logoSrcQG=gameQG.logo_official.startsWith('http')?gameQG.logo_official:LOGO_BASE+gameQG.logo_official;
  else if(gameQG.logo) logoSrcQG=gameQG.logo.startsWith('http')?gameQG.logo:LOGO_BASE+gameQG.logo;

  const rQui=quiDraws[quiDraws.length-1]||{};
  const rQG=qgDraws[qgDraws.length-1]||{};
  const betQui=Array.isArray(rQui.bet)?rQui.bet:[];
  const betQG=Array.isArray(rQG.bet)?rQG.bet:[];
  const matchesQui=rQui.other?.matches||[];
  const matchesQG=rQG.other?.matches||[];

  // Pleno al 15: extra = [goals_team1, goals_team2] e.g. ["1","1"]
  const plenoArr=Array.isArray(rQui.extra)?rQui.extra:[];
  const plenoG1=plenoArr.length>0?String(plenoArr[0]):null;
  const plenoG2=plenoArr.length>1?String(plenoArr[1]):null;
  // Pleno al 15 teams: match at position 15 in matchesQui (labeled "P-15" on web)
  const plenoMatch15=matchesQui.find(function(x){
    return parseInt(x.position)===15 || String(x.position)==='P-15' || String(x.position).toLowerCase().includes('15');
  })||null;
  const plenoT1=plenoMatch15?.team_1_name||'';
  const plenoT2=plenoMatch15?.team_2_name||'';

  const fd=rQui.date?new Date(rQui.date+'T12:00:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}):'';
  const pending=!betQui.length&&!betQG.length;

  // Larger font since col4 is now taller
  const rowFs='.62rem';
  const rowPad='2px 0';

  function goalBadge(g){
    if(g===null||g==='') return '<span style="width:18px;flex-shrink:0"></span>';
    const bg=g==='M'?'#7c3aed':g==='0'?'#374151':'#16a34a';
    return '<span style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:14px;background:'+bg+';color:#fff;border-radius:3px;font-family:var(--font-ui);font-size:.55rem;font-weight:700;flex-shrink:0">'+esc(g)+'</span>';
  }
  function quiBadge(res){
    if(res==null||res==='') return '<span style="width:22px;flex-shrink:0"></span>';
    const rc=res==='1'?'#2563eb':res==='2'?'#dc2626':'#ca8a04';
    return '<span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:16px;background:'+rc+';color:#fff;border-radius:3px;font-family:var(--font-ui);font-size:.55rem;font-weight:700;flex-shrink:0">'+esc(res)+'</span>';
  }
  function qgBadge(res){
    if(res==null||res==='') return '<span style="width:32px;flex-shrink:0"></span>';
    const parts=String(res).split('-');
    if(parts.length===2){
      return '<span style="display:inline-flex;align-items:center;justify-content:center;gap:0px;height:16px;background:#7c3aed;color:#fff;border-radius:3px;padding:0 2px;font-family:var(--font-ui);font-size:.55rem;font-weight:700;flex-shrink:0;min-width:32px">'

// ── SCALE BALL ROWS ───────────────────
// After render, shrink any ball row that overflows its container.
// Uses uniform scale() so balls stay perfectly round.
function scaleBallRows(){
  document.querySelectorAll('.result-block .ball-row').forEach(row=>{
    row.style.transform='';
    row.style.transformOrigin='';
    // Walk up to find the padded container
    const container=row.closest('[style*="padding"]')||row.parentElement;
    if(!container) return;
    const padH=20; // ~10px each side
    const available=container.clientWidth - padH;
    const actual=row.scrollWidth;
    if(actual>0 && available>0 && actual>available){
      const scale=Math.max(0.5, available/actual);
      row.style.transform=`scale(${scale.toFixed(3)})`;
      row.style.transformOrigin='left center';
      // Compensate vertical space so scaled row doesn't overlap next element
      row.style.marginBottom=`${-(row.offsetHeight*(1-scale))}px`;
    }
  });
}

// ── COUNTDOWN ────────────────────────
function startCountdown(elId,dateStr,game){
  let drawHour='20:00';
  try{const h=JSON.parse(game.draw_hours||'{}');const v=Object.values(h);if(v.length)drawHour=v[0];}catch{}
  const target=new Date(dateStr+'T'+drawHour+':00');
  function update(){
    const el=document.getElementById(elId);if(!el)return;
    const diff=target-new Date();
    if(diff<=0){el.textContent='Hoy';el.className='card-countdown urgent';return;}
    const days=Math.floor(diff/86400000);const hours=Math.floor((diff%86400000)/3600000);const mins=Math.floor((diff%3600000)/60000);
    let txt='',cls='card-countdown';
    if(days>1){txt=`${days}d ${hours}h`;}
    else if(days===1){txt=`${hours}h ${mins}m`;cls+=' soon';}
    else if(hours>0){txt=`${hours}h ${mins}m`;cls+=' soon';}
    else{txt=`${mins}m`;cls+=' urgent';}
    el.textContent=txt;el.className=cls;
  }
  update();
  const t=setInterval(update,30000);countdownTimers.push(t);
}

// ── FIT AMOUNTS ───────────────────────
function fitAmountFonts(){
  // First pass: fit each card to available space
  document.querySelectorAll('.jackpot-card').forEach(card=>{
    const wrap=card.querySelector('.card-amount-wrap'),amt=card.querySelector('.card-amount');
    if(!wrap||!amt)return;
    let size=Math.min(wrap.clientHeight*.72,80);
    amt.style.fontSize=size+'px';
    while(amt.scrollWidth>wrap.clientWidth*.95&&size>18){size-=2;amt.style.fontSize=size+'px';}
  });
  // Second pass: normalize — cards with fewer chars should NOT be larger than cards with more chars
  // Find the minimum font size across all cards and apply it to all (uniform sizing)
  const sizes=[];
  document.querySelectorAll('.jackpot-card .card-amount').forEach(amt=>{
    sizes.push(parseFloat(amt.style.fontSize)||80);
  });
  if(!sizes.length) return;
  const minSize=Math.min(...sizes);
  document.querySelectorAll('.jackpot-card .card-amount').forEach(amt=>{
    amt.style.fontSize=minSize+'px';
  });
}

// ── MIXED VIEW RENDERS ──────────────────────────────────────────────────────
function renderMixedJackpots(data){
  const grid=document.getElementById('mixed-jackpots-grid');
  if(!grid) return;
  grid.innerHTML='';
  const items=data.filter(item=>!Object.keys(gamesMap).length||gamesMap[item.id_game]);
  if(!items.length) return;
  const n=items.length;
  // In mixed, jackpots panel is vertical-ish — use 1-2 cols
  const cols=n<=3?1:2;
  grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  grid.style.gridTemplateRows=`repeat(${Math.ceil(n/cols)},1fr)`;
  // Reuse jackpots render logic but into mixed grid
  const maxJ=Math.max(...items.map(i=>parseFloat(i.jackpot)||0));
  const minDate=items.reduce((m,i)=>(!i.date?m:(!m||i.date<m?i.date:m)),null);
  items.forEach((item,i)=>{
    const game=gamesMap[item.id_game]||{};
    const barClr=game.bg_color||'var(--pv-primary)';
    // Always use game jackpot color; fallback to pv-primary
    const rawAmtClr=game.jackpot_fg_color||'';
    const amtClr = (rawAmtClr&&rawAmtClr!=='#000000'&&rawAmtClr!=='#FFFFFF'&&rawAmtClr!=='#ffffff'&&rawAmtClr!=='#000')
      ? rawAmtClr : 'var(--pv-primary)';
    const jackpot=parseFloat(item.jackpot)||0;
    const isHighest=jackpot>0&&jackpot===maxJ;
    const isNext=item.date&&item.date===minDate;
    let logoSrc='';
    if(game.logo_official) logoSrc=game.logo_official.startsWith('http')?game.logo_official:LOGO_BASE+game.logo_official;
    else if(game.logo)     logoSrc=game.logo.startsWith('http')?game.logo:LOGO_BASE+game.logo;
    const millones=jackpot/1000000;
    let amountHtml;
    if(jackpot>=1000000){
      const milStr=Number.isInteger(millones)?millones.toString():millones.toFixed(1).replace('.',',');
      const label=millones===1?'MILLÓN DE EUROS':'MILLONES DE EUROS';
      amountHtml=`<span class="card-amount-number">${milStr}</span><span class="card-amount-label">${label}</span>`;
    } else {
      amountHtml=`<span class="card-amount-number">${Math.floor(jackpot).toLocaleString('es-ES')}</span><span class="card-amount-label">EUROS</span>`;
    }
    const card=document.createElement('div');
    card.className='jackpot-card'+(isHighest?' is-highest':'')+(isNext?' is-next':'');
    card.style.animationDelay=`${i*30}ms`;
    card.innerHTML=`
      <div class="card-bar" style="background:${barClr}"></div>
      <div class="card-header">
        ${logoSrc?`<img class="card-logo" src="${esc(logoSrc)}" alt="" onerror="hideImg(this)">` :''}
        <div class="card-name">${esc(item.name||game.name||'—')}</div>
      </div>
      <div class="card-amount-wrap">
        <div class="card-amount" style="color:${amtClr}">${amountHtml}</div>
      </div>`;
    grid.appendChild(card);
  });
  setTimeout(()=>{
    grid.querySelectorAll('.card-amount').forEach(amt=>{
      const wrap=amt.closest('.card-amount-wrap');
      if(!wrap) return;
      let size=Math.min(wrap.clientHeight*.7,60);
      amt.style.fontSize=size+'px';
      while(amt.scrollWidth>wrap.clientWidth*.95&&size>14){size-=2;amt.style.fontSize=size+'px';}
    });
    // Normalize
    const sizes=[...grid.querySelectorAll('.card-amount')].map(a=>parseFloat(a.style.fontSize)||60);
    const minS=Math.min(...sizes);
    grid.querySelectorAll('.card-amount').forEach(a=>a.style.fontSize=minS+'px');
  },100);
}

function renderMixedResults(data){
  const grid=document.getElementById('mixed-results-grid');
  if(!grid) return;
  // In mixed mode, results are in vertical (orient-v) layout
  // Temporarily fake orient-v for renderResults, then restore
  document.body.classList.add('orient-v');
  grid.innerHTML='';
  // Mini version: just call renderResults logic directing to mixed grid

}

// ── LOAD ALL ──────────────────────────
let _loadingInProgress=false;
async function loadAllData(){
  if(_loadingInProgress){ console.log('[boot] loadAllData already running, skipping'); return; }
  _loadingInProgress=true;
  showLoading(true);
  try{
    setLoadingStep('Conectando pv-info...');
    await fetchPvInfo();
    setLoadingStep('Cargando juegos...');
    await fetchGames();
    setLoadingStep('Cargando datos...');
    await Promise.all([fetchJackpots(), fetchResults()]);
    setLoadingStep('Listo');
  }catch(e){
    console.error('[boot] loadAllData error:',e);
    setLoadingStep('ERROR: '+e.message);
    // Show error on screen for 5s then try to continue
    await new Promise(r=>setTimeout(r,5000));
  }
  showLoading(false);
  _loadingInProgress=false;
  switchView(currentView||'jackpots');
}

// ── DIAGNOSTICO ───────────────────────
async function diagRunGameResults(){
  diagClear();
  const cfg=loadConfig();
  const gameIds=Object.keys(gamesMap);
  if(!gameIds.length){
    diagLog('ERROR: gamesMap vacío — ejecuta get-games primero','#e05c2a');
    return;
  }
  diagLog(`► last-game-results para ${gameIds.length} juegos LAE`,'#f0b429');
  diagLog(`  URL: ${cfg.url}/ws/last-game-results`,'#5a7a8e');
  for(const id of gameIds){
    const game=gamesMap[id]||{};
    diagLog(`\n── Juego ${id}: ${game.name||'?'}`,'#f0b429');
    try{
      const t0=Date.now();
      const body={token:cfg.token,pass:cfg.pass,app_id:cfg.appid,id_game:parseInt(id),limit:7};
      const resp=await fetch(`${cfg.url}/ws/last-game-results`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const ms=Date.now()-t0;
      const text=await resp.text();
      diagLog(`   HTTP ${resp.status} en ${ms}ms`,resp.ok?'#27c97a':'#e05c2a');
      try{
        const json=JSON.parse(text);
        const results=json.data||[];
        diagLog(`   Resultados: ${Array.isArray(results)?results.length:JSON.stringify(results).substring(0,80)}`,'#b0ccd8');
        if(Array.isArray(results)&&results.length){
          results.forEach(r=>diagLog(`   ${r.date} is_confirmed:${r.is_confirmed} bet:${JSON.stringify(r.bet).substring(0,60)}`,'#8ab4c8'));
        }
      }catch{diagLog(`   Raw: ${text.substring(0,200)}`,'#b0ccd8');}
    }catch(e){diagLog(`   ERROR: ${e.message}`,'#e05c2a');}
  }
  diagLog('✓ Diagnóstico completado','#27c97a');
}

function diagCopyLog(){
  const el=document.getElementById('diag-output');
  const text=[...el.querySelectorAll('div')].map(d=>d.textContent).join('\n');
  navigator.clipboard.writeText(text).then(()=>{
    const btn=event.target;
    const orig=btn.textContent;
    btn.textContent='✓ Copiado';
    setTimeout(()=>btn.textContent=orig,2000);
  }).catch(()=>{
    // Fallback for WebView
    const ta=document.createElement('textarea');
    ta.value=text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const btn=event.target;
    const orig=btn.textContent;
    btn.textContent='✓ Copiado';
    setTimeout(()=>btn.textContent=orig,2000);
  });
}

function diagLog(m,c){const el=document.getElementById('diag-output');const l=document.createElement('div');l.style.color=c||'#8ab4c8';l.textContent=m;el.appendChild(l);el.scrollTop=el.scrollHeight;}
function diagClear(){document.getElementById('diag-output').innerHTML='';}
async function diagRun(endpoint){
  diagClear();const cfg=loadConfig();
  diagLog(`► Llamada directa: ${cfg.url}/ws/${endpoint}`,'#f0b429');
  diagLog(`  token:  ${cfg.token}`,'#5a7a8e');
  diagLog(`  pass:   ${'•'.repeat(cfg.pass.length)}`,'#5a7a8e');
  diagLog(`  app_id: ${cfg.appid}`,'#5a7a8e');
  diagLog('Enviando petición...','#3a5a6e');
  try{
    const body={token:cfg.token,pass:cfg.pass,app_id:cfg.appid};
    const t0=Date.now();
    const url=`${cfg.url}/ws/${endpoint}`;
    const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const ms=Date.now()-t0;const text=await resp.text();
    diagLog(`✓ Respuesta en ${ms}ms — HTTP ${resp.status}`,resp.ok?'#27c97a':'#e05c2a');diagLog('','');
    try{
      const json=JSON.parse(text);const lines=JSON.stringify(json,null,2).split('\n');const MAX=120;
      lines.slice(0,MAX).forEach(l=>diagLog(l,'#b0ccd8'));
      if(lines.length>MAX)diagLog(`... (${lines.length-MAX} líneas más en consola)`,'#3a5a6e');
      console.log(`[Diag] ${endpoint}:`,json);
    }catch{diagLog(text.substring(0,2000),'#b0ccd8');}
  }catch(e){diagLog(`✗ Error: ${e.message}`,'#e05c2a');}
}
