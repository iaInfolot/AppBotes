<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Botes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@300;400;600;700&display=swap');

/* ════════════════════════════════════════════
   CSS VARIABLES — light/dark + PV brand colors
════════════════════════════════════════════ */
:root {
  --pv-primary:   #f0b429;
  --pv-secondary: #e05c2a;

  /* DARK MODE (default) */
  --bg:       #07090e;
  --surface:  #0f1319;
  --card:     #131820;
  --card2:    #171e28;
  --border:   #1d2738;
  --text:     #e6ecf3;
  --text2:    #8a9bb0;
  --muted:    #3d4f62;
  --success:  #27c97a;
  --radius:   14px;
  --shadow:   0 4px 24px rgba(0,0,0,.45);

  --font-display: 'Bebas Neue', sans-serif;
  --font-ui:      'Barlow Condensed', sans-serif;
  --font-body:    'Barlow', sans-serif;
}

body.light {
  --bg:      #f0f2f5;
  --surface: #ffffff;
  --card:    #ffffff;
  --card2:   #f7f8fa;
  --border:  #dde2ea;
  --text:    #111827;
  --text2:   #4b5563;
  --muted:   #9ca3af;
  --shadow:  0 4px 24px rgba(0,0,0,.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  overflow: hidden;
  transition: background .3s, color .3s;
}

/* ════════════════════════════════════════════
   LOADING
════════════════════════════════════════════ */
#loading {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px; z-index: 200;
}
#loading-logo {
  font-family: var(--font-display);
  font-size: 2.8rem;
  letter-spacing: 6px;
  color: var(--pv-primary);
}
#loading-step {
  font-family: var(--font-ui);
  font-size: .82rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--muted);
}
.spinner {
  width: 36px; height: 36px;
  border: 2px solid var(--border);
  border-top-color: var(--pv-primary);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}

/* ════════════════════════════════════════════
   APP SHELL
════════════════════════════════════════════ */
#app {
  display: none;
  width: 100vw; height: 100vh;
  flex-direction: column;
}
#app.visible { display: flex; }

/* ════════════════════════════════════════════
   HEADER
════════════════════════════════════════════ */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 32px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  gap: 16px;
  background: var(--surface);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

#pv-logo {
  height: 42px; width: auto;
  max-width: 140px;
  object-fit: contain;
  display: none;
  flex-shrink: 0;
}

.title-block { min-width: 0; }

#pv-name {
  font-family: var(--font-display);
  font-size: 1.9rem;
  letter-spacing: 3px;
  color: var(--pv-primary);
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#pv-subtitle {
  font-family: var(--font-ui);
  font-size: .68rem;
  font-weight: 300;
  color: var(--muted);
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-top: 1px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}

#clock {
  font-family: var(--font-ui);
  font-size: 1.55rem;
  font-weight: 300;
  color: var(--text2);
  letter-spacing: 3px;
}

#menu-btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 16px;
  border-radius: 8px;
  font-family: var(--font-ui);
  font-size: .85rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color .2s, color .2s;
  white-space: nowrap;
}
#menu-btn:hover { border-color: var(--pv-primary); color: var(--pv-primary); }

.accent-line {
  height: 2px;
  background: linear-gradient(90deg, var(--pv-primary) 0%, var(--pv-secondary) 40%, transparent 80%);
  flex-shrink: 0;
}

/* ════════════════════════════════════════════
   MAIN CONTENT
════════════════════════════════════════════ */
#main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: 16px 28px 0;
}

.section-label {
  font-family: var(--font-ui);
  font-size: .68rem;
  font-weight: 600;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-label::before {
  content: '';
  display: inline-block;
  width: 5px; height: 5px;
  background: var(--pv-primary);
  border-radius: 50%;
}

/* ════════════════════════════════════════════
   JACKPOTS GRID — fills 100% height
════════════════════════════════════════════ */
#jackpots-grid {
  flex: 1;
  display: grid;
  gap: 12px;
  overflow: hidden;
  padding-bottom: 16px;
  /* columns/rows set dynamically by JS */
}

/* ════════════════════════════════════════════
   JACKPOT CARD
════════════════════════════════════════════ */
.jackpot-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
  animation: fadeUp .35s ease both;
  transition: transform .2s, box-shadow .2s, border-color .2s;
  min-height: 0;
}
.jackpot-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0,0,0,.35);
  border-color: var(--pv-primary);
}

/* top color bar from game bg_color */
.card-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: var(--radius) var(--radius) 0 0;
}

/* ── CARD HEADER: logo + name ── */
.card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  flex-shrink: 0;
}

.card-logo {
  width: 36px; height: 36px;
  object-fit: contain;
  border-radius: 6px;
  flex-shrink: 0;
  background: transparent;
}

.card-name {
  font-family: var(--font-ui);
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: .5px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.card-days {
  font-family: var(--font-ui);
  font-size: .65rem;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  flex-shrink: 0;
}

/* ── JACKPOT AMOUNT — most prominent ── */
.card-amount-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  min-height: 0;
}

.card-amount {
  font-family: var(--font-display);
  letter-spacing: 1px;
  line-height: 1;
  /* font-size set dynamically */
}

.card-currency {
  font-size: .55em;
  opacity: .7;
  margin-right: 3px;
  vertical-align: super;
}

/* ── CARD FOOTER: date + addons ── */
.card-footer {
  flex-shrink: 0;
  margin-top: 6px;
}

.card-date {
  font-size: .72rem;
  color: var(--text2);
  font-weight: 300;
  margin-bottom: 5px;
}

.card-addons {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.addon-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 3px 10px;
  font-family: var(--font-ui);
  font-size: .72rem;
}
.addon-name { color: var(--text2); }
.addon-amt  { color: var(--success); font-weight: 600; }

/* ════════════════════════════════════════════
   EMPTY STATE
════════════════════════════════════════════ */
#empty-state {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  gap: 14px;
  color: var(--muted);
}
#empty-state .ei { font-size: 3rem; }
#empty-state p {
  font-family: var(--font-ui);
  font-size: .85rem;
  letter-spacing: 4px;
  text-transform: uppercase;
}

/* ════════════════════════════════════════════
   STATUS BAR
════════════════════════════════════════════ */
#status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 28px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--surface);
  gap: 12px;
}

#status-msg {
  font-size: .68rem;
  color: var(--muted);
  font-family: var(--font-ui);
  letter-spacing: 1px;
}
#status-msg.error { color: #e05c2a; }
#status-msg.ok    { color: var(--success); }

.status-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

#last-update, #app-ver {
  font-size: .65rem;
  color: var(--muted);
  font-family: var(--font-ui);
  letter-spacing: 1px;
  white-space: nowrap;
}

/* ════════════════════════════════════════════
   OVERLAY + MODALS
════════════════════════════════════════════ */
#overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.72);
  backdrop-filter: blur(8px);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
#overlay.visible { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 28px 32px;
  width: 520px;
  max-width: 95vw;
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
  box-shadow: 0 24px 64px rgba(0,0,0,.5);
}
.modal::-webkit-scrollbar { width: 3px; }
.modal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.modal h2 {
  font-family: var(--font-display);
  font-size: 1.6rem;
  letter-spacing: 3px;
  color: var(--pv-primary);
  margin-bottom: 3px;
}
.modal-sub {
  font-size: .68rem;
  color: var(--muted);
  margin-bottom: 22px;
  font-family: var(--font-ui);
  letter-spacing: 3px;
  text-transform: uppercase;
}

.close-btn {
  position: absolute;
  top: 14px; right: 16px;
  background: none; border: none;
  color: var(--muted);
  font-size: 1.2rem;
  cursor: pointer;
  transition: color .2s;
  line-height: 1;
}
.close-btn:hover { color: var(--text); }

/* ── form elements ── */
.cfg-section {
  font-family: var(--font-ui);
  font-size: .68rem;
  font-weight: 600;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--pv-primary);
  margin: 18px 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.cfg-section::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.form-group { margin-bottom: 13px; }
.form-group label {
  display: block;
  font-family: var(--font-ui);
  font-size: .68rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 5px;
}
.form-group input,
.form-group select {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: .9rem;
  padding: 8px 12px;
  outline: none;
  transition: border-color .2s;
  appearance: none;
}
.form-group input:focus,
.form-group select:focus { border-color: var(--pv-primary); }

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

/* color picker row */
.color-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.color-row input[type="color"] {
  width: 40px; height: 36px;
  padding: 2px 4px;
  border-radius: 6px;
  cursor: pointer;
  flex-shrink: 0;
}
.color-row input[type="text"] {
  flex: 1;
  font-family: monospace;
  font-size: .85rem;
}

.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.btn {
  font-family: var(--font-ui);
  font-size: .85rem;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  border: none;
  border-radius: 8px;
  padding: 9px 20px;
  cursor: pointer;
  transition: opacity .2s, transform .1s;
  white-space: nowrap;
}
.btn:hover  { opacity: .85; }
.btn:active { transform: scale(.97); }
.btn-primary   { background: var(--pv-primary); color: #000; }
.btn-secondary { background: var(--card); border: 1px solid var(--border); color: var(--text); }
.btn-danger    { background: #b03020; color: #fff; margin-left: auto; }

/* ── MENU LIST ── */
.menu-list { list-style: none; display: flex; flex-direction: column; gap: 7px; margin-bottom: 20px; }
.menu-list li button {
  width: 100%; text-align: left;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  padding: 12px 16px;
  font-family: var(--font-ui);
  font-size: 1rem;
  letter-spacing: 1px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: border-color .2s, color .2s;
}
.menu-list li button:hover { border-color: var(--pv-primary); color: var(--pv-primary); }
.menu-icon { font-size: 1.1rem; width: 24px; text-align: center; }

.app-version { font-size: .65rem; color: var(--muted); font-family: var(--font-ui); letter-spacing: 1px; }

/* ── DIAG OUTPUT ── */
#diag-output {
  background: #050709;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  font-family: 'Courier New', monospace;
  font-size: .7rem;
  line-height: 1.6;
  color: #8ab4c8;
  max-height: 50vh;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
}

/* ════════════════════════════════════════════
   VERTICAL ORIENTATION overrides
════════════════════════════════════════════ */
body.orient-v header { padding: 10px 18px; }
body.orient-v #pv-name { font-size: 1.5rem; }
body.orient-v #clock  { font-size: 1.2rem; }
body.orient-v #main-content { padding: 12px 16px 0; }
body.orient-v #status-bar   { padding: 6px 16px; }

/* ════════════════════════════════════════════
   ANIMATIONS
════════════════════════════════════════════ */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="orient-h">

<!-- LOADING -->
<div id="loading">
  <div id="loading-logo">Botes</div>
  <div class="spinner"></div>
  <div id="loading-step">Iniciando...</div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-left">
      <img id="pv-logo" src="" alt="Logo PV">
      <div class="title-block">
        <div id="pv-name">—</div>
        <div id="pv-subtitle">Próximos Botes</div>
      </div>
    </div>
    <div class="header-right">
      <div id="clock">--:--</div>
      <button id="menu-btn" onclick="openMenu()">☰ Menú</button>
    </div>
  </header>
  <div class="accent-line"></div>

  <div id="main-content">
    <div class="section-label">Próximos Sorteos</div>
    <div id="jackpots-grid"></div>
    <div id="empty-state">
      <div class="ei">🎰</div>
      <p>No hay botes disponibles</p>
    </div>
  </div>

  <div id="status-bar">
    <span id="status-msg">Listo</span>
    <div class="status-right">
      <span id="last-update"></span>
      <span id="app-ver"></span>
    </div>
  </div>
</div>

<!-- OVERLAY -->
<div id="overlay">

  <!-- MENU -->
  <div class="modal" id="modal-menu">
    <button class="close-btn" onclick="closeOverlay()">✕</button>
    <h2>Menú</h2>
    <div class="modal-sub">Navegación</div>
    <ul class="menu-list">
      <li><button onclick="goHome()"><span class="menu-icon">🏠</span>Inicio — Botes</button></li>
      <li><button onclick="showConfig()"><span class="menu-icon">⚙️</span>Configuración</button></li>
      <li><button onclick="manualRefresh()"><span class="menu-icon">🔄</span>Actualizar datos</button></li>
    </ul>
    <div class="app-version" id="menu-version"></div>
  </div>

  <!-- CONFIG -->
  <div class="modal" id="modal-config" style="display:none; width:580px;">
    <button class="close-btn" onclick="closeOverlay()">✕</button>
    <h2>Configuración</h2>
    <div class="modal-sub">Parámetros del sistema</div>

    <div class="cfg-section">WebService</div>
    <div class="form-group">
      <label>URL del WebService</label>
      <input type="text" id="cfg-url" placeholder="https://webservice.infolot.es">
    </div>
    <div class="form-group">
      <label>URL del Proxy</label>
      <input type="text" id="cfg-proxy" placeholder="https://app.gesloto.es/proxy.php">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>App ID</label>
        <input type="text" id="cfg-appid">
      </div>
      <div class="form-group">
        <label>Token</label>
        <input type="text" id="cfg-token">
      </div>
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="cfg-pass">
    </div>

    <div class="cfg-section">Apariencia</div>
    <div class="form-row">
      <div class="form-group">
        <label>Color primario (PV)</label>
        <div class="color-row">
          <input type="color" id="cfg-color1-pick" oninput="syncColor('cfg-color1','cfg-color1-pick')">
          <input type="text"  id="cfg-color1" maxlength="7" oninput="syncColor('cfg-color1-pick','cfg-color1',true)">
        </div>
      </div>
      <div class="form-group">
        <label>Color secundario (PV)</label>
        <div class="color-row">
          <input type="color" id="cfg-color2-pick" oninput="syncColor('cfg-color2','cfg-color2-pick')">
          <input type="text"  id="cfg-color2" maxlength="7" oninput="syncColor('cfg-color2-pick','cfg-color2',true)">
        </div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Modo de pantalla</label>
        <select id="cfg-theme">
          <option value="dark">Oscuro</option>
          <option value="light">Claro</option>
        </select>
      </div>
      <div class="form-group">
        <label>Orientación</label>
        <select id="cfg-orient">
          <option value="h">Horizontal</option>
          <option value="v">Vertical</option>
        </select>
      </div>
    </div>

    <div class="cfg-section">Actualización automática</div>
    <div class="form-row">
      <div class="form-group">
        <label>Refresco botes (min, 0=manual)</label>
        <input type="number" id="cfg-refresh-jackpots" min="0" max="1440">
      </div>
      <div class="form-group">
        <label>Refresco PV+Juegos (horas, 0=manual)</label>
        <input type="number" id="cfg-refresh-pvinfo" min="0" max="168">
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-primary"   onclick="saveConfig()">💾 Guardar</button>
      <button class="btn btn-secondary" onclick="showMenu()">← Volver</button>
      <button class="btn btn-secondary" onclick="showDiag()">🔍 Diagnóstico</button>
      <button class="btn btn-danger"    onclick="resetConfig()">Restablecer</button>
    </div>
  </div>

  <!-- DIAGNOSTICO -->
  <div class="modal" id="modal-diag" style="display:none; width:680px;">
    <button class="close-btn" onclick="closeOverlay()">✕</button>
    <h2>Diagnóstico</h2>
    <div class="modal-sub">Prueba de llamadas al WebService</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;">
      <button class="btn btn-secondary" onclick="diagRun('pv-info')">▶ pv-info</button>
      <button class="btn btn-secondary" onclick="diagRun('get-games')">▶ get-games</button>
      <button class="btn btn-secondary" onclick="diagRun('next-jackpots')">▶ next-jackpots</button>
      <button class="btn btn-secondary" style="margin-left:auto" onclick="diagClear()">Limpiar</button>
    </div>
    <div id="diag-output">Pulsa un botón para ejecutar la llamada...</div>
    <div class="modal-actions" style="margin-top:12px;">
      <button class="btn btn-secondary" onclick="showConfig()">← Volver</button>
    </div>
  </div>

</div><!-- /overlay -->

<script>
// ════════════════════════════════════════════
//  CONSTANTS
// ════════════════════════════════════════════
const APP_VERSION  = '1.3';
const APP_REVISION = '20260531-005';
const STORAGE_KEY  = 'infolot_cfg_v5';
const LOGO_BASE    = 'https://panel.infolot.es';

const DEFAULTS = {
  url:             'https://webservice.infolot.es',
  proxy:           'https://app.gesloto.es/proxy.php',
  appid:           '41461407-985d-4834-973f-1a672edb74e2',
  token:           '1d446400-a63a-4467-bef9-1e661971c931',
  pass:            '48].-.TuNa&Pu%26',
  color1:          '#f0b429',
  color2:          '#e05c2a',
  theme:           'dark',
  orient:          null,
  refreshJackpots: 0,
  refreshPvInfo:   0
};

const DAY_NAMES = {1:'Lun',2:'Mar',3:'Mié',4:'Jue',5:'Vie',6:'Sáb',7:'Dom'};

let gamesMap = {};
let pvData   = {};
let timers   = {};

// ════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════
function loadConfig() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    return s ? { ...DEFAULTS, ...JSON.parse(s) } : { ...DEFAULTS };
  } catch { return { ...DEFAULTS }; }
}

function persistConfig(cfg) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
}

function saveConfig() {
  const cfg = {
    url:             document.getElementById('cfg-url').value.trim()    || DEFAULTS.url,
    proxy:           document.getElementById('cfg-proxy').value.trim()  || DEFAULTS.proxy,
    appid:           document.getElementById('cfg-appid').value.trim()  || DEFAULTS.appid,
    token:           document.getElementById('cfg-token').value.trim()  || DEFAULTS.token,
    pass:            document.getElementById('cfg-pass').value          || DEFAULTS.pass,
    color1:          document.getElementById('cfg-color1').value        || DEFAULTS.color1,
    color2:          document.getElementById('cfg-color2').value        || DEFAULTS.color2,
    theme:           document.getElementById('cfg-theme').value,
    orient:          document.getElementById('cfg-orient').value,
    refreshJackpots: parseInt(document.getElementById('cfg-refresh-jackpots').value) || 0,
    refreshPvInfo:   parseInt(document.getElementById('cfg-refresh-pvinfo').value)   || 0
  };
  persistConfig(cfg);
  applyTheme(cfg.theme);
  applyOrientation(cfg.orient);
  applyBrandColors(cfg.color1, cfg.color2);
  closeOverlay();
  setupTimers(cfg);
  loadAllData();
}

function fillConfigForm(cfg) {
  document.getElementById('cfg-url').value              = cfg.url;
  document.getElementById('cfg-proxy').value            = cfg.proxy;
  document.getElementById('cfg-appid').value            = cfg.appid;
  document.getElementById('cfg-token').value            = cfg.token;
  document.getElementById('cfg-pass').value             = cfg.pass;
  document.getElementById('cfg-color1').value           = cfg.color1;
  document.getElementById('cfg-color1-pick').value      = cfg.color1;
  document.getElementById('cfg-color2').value           = cfg.color2;
  document.getElementById('cfg-color2-pick').value      = cfg.color2;
  document.getElementById('cfg-theme').value            = cfg.theme;
  document.getElementById('cfg-orient').value           = cfg.orient || detectOrientation();
  document.getElementById('cfg-refresh-jackpots').value = cfg.refreshJackpots;
  document.getElementById('cfg-refresh-pvinfo').value   = cfg.refreshPvInfo;
}

function resetConfig() {
  if (!confirm('¿Restablecer la configuración por defecto?')) return;
  localStorage.removeItem(STORAGE_KEY);
  const fresh = { ...DEFAULTS, orient: detectOrientation() };
  fillConfigForm(fresh);
  applyTheme(fresh.theme);
  applyBrandColors(fresh.color1, fresh.color2);
  setStatus('Configuración restablecida', 'ok');
}

function syncColor(targetId, sourceId, fromText) {
  const src = document.getElementById(sourceId);
  const tgt = document.getElementById(targetId);
  if (!src || !tgt) return;
  const val = src.value;
  if (fromText && !/^#[0-9a-fA-F]{6}$/.test(val)) return;
  tgt.value = val;
}

// ════════════════════════════════════════════
//  THEME / ORIENTATION / BRAND
// ════════════════════════════════════════════
function detectOrientation() {
  try {
    const t = screen.orientation ? screen.orientation.type : '';
    if (t.includes('portrait')) return 'v';
    if (t.includes('landscape')) return 'h';
    return window.innerHeight > window.innerWidth ? 'v' : 'h';
  } catch { return 'h'; }
}

function applyTheme(theme) {
  document.body.classList.toggle('light', theme === 'light');
}

function applyOrientation(orient) {
  document.body.classList.remove('orient-h', 'orient-v');
  document.body.classList.add('orient-' + (orient || 'h'));
}

function applyBrandColors(c1, c2) {
  const r = document.documentElement.style;
  r.setProperty('--pv-primary',   c1 || DEFAULTS.color1);
  r.setProperty('--pv-secondary', c2 || DEFAULTS.color2);
}

// ════════════════════════════════════════════
//  CLOCK
// ════════════════════════════════════════════
function updateClock() {
  const n = new Date();
  document.getElementById('clock').textContent =
    String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
}

// ════════════════════════════════════════════
//  WS CALL
// ════════════════════════════════════════════
async function wsCall(endpoint, extra = {}) {
  const cfg  = loadConfig();
  const body = { _endpoint: endpoint, token: cfg.token, pass: cfg.pass, app_id: cfg.appid, ...extra };
  const resp = await fetch(cfg.proxy.replace('http://', 'https://'), {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify(body)
  });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const json = await resp.json();
  if (json.error) throw new Error(json.error);
  return json.data;
}

// ════════════════════════════════════════════
//  PV-INFO
// ════════════════════════════════════════════
async function fetchPvInfo() {
  setLoadingStep('Cargando datos del punto de venta...');
  try {
    pvData = await wsCall('pv-info') || {};
    const name = pvData?.company?.name_comercial
              || pvData?.company?.name_social
              || 'Mi Lotería';
    document.getElementById('pv-name').textContent      = name;
    document.getElementById('loading-logo').textContent = name;
    document.title = name + ' · Botes';
  } catch(e) {
    console.warn('pv-info:', e.message);
    document.getElementById('pv-name').textContent = 'Mi Lotería';
  }
}

// ════════════════════════════════════════════
//  GET-GAMES
// ════════════════════════════════════════════
async function fetchGames() {
  setLoadingStep('Cargando juegos...');
  try {
    const data = await wsCall('get-games');
    gamesMap = {};
    if (data && typeof data === 'object') {
      Object.values(data).forEach(g => {
        // Only keep LAE games
        if (g.lae) gamesMap[g.id] = g;
      });
    }
  } catch(e) {
    console.warn('get-games:', e.message);
    gamesMap = {};
  }
}

// ════════════════════════════════════════════
//  NEXT-JACKPOTS
// ════════════════════════════════════════════
async function fetchJackpots() {
  setStatus('Actualizando botes...', '');
  try {
    const data = await wsCall('next-jackpots');
    renderJackpots(Array.isArray(data) ? data : []);
    document.getElementById('last-update').textContent =
      'Act: ' + new Date().toLocaleTimeString('es-ES');
    setStatus('Datos actualizados', 'ok');
  } catch(e) {
    setStatus('Error: ' + e.message, 'error');
    renderJackpots([]);
  }
}

// ════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════
function renderJackpots(data) {
  const grid  = document.getElementById('jackpots-grid');
  const empty = document.getElementById('empty-state');
  grid.innerHTML = '';

  // Filter to only LAE games that appear in gamesMap
  const items = data.filter(item => !Object.keys(gamesMap).length || gamesMap[item.id_game]);

  if (!items.length) {
    grid.style.display  = 'none';
    empty.style.display = 'flex';
    return;
  }
  grid.style.display  = '';
  empty.style.display = 'none';

  // ── Grid layout: fill available space ──
  const isVertical = document.body.classList.contains('orient-v');
  const n = items.length;
  let cols, rows;

  if (isVertical) {
    cols = 1;
    rows = n;
  } else {
    // Horizontal: find best cols/rows to fill the space
    if      (n <= 2)  { cols = n;  rows = 1; }
    else if (n <= 4)  { cols = 2;  rows = Math.ceil(n/2); }
    else if (n <= 6)  { cols = 3;  rows = Math.ceil(n/3); }
    else if (n <= 8)  { cols = 4;  rows = Math.ceil(n/4); }
    else if (n <= 9)  { cols = 3;  rows = 3; }
    else              { cols = 4;  rows = Math.ceil(n/4); }
  }

  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.style.gridTemplateRows    = `repeat(${rows}, 1fr)`;

  items.forEach((item, i) => {
    const game   = gamesMap[item.id_game] || {};
    const barClr = game.bg_color || 'var(--pv-primary)';
    const amtClr = game.jackpot_fg_color || 'var(--pv-primary)';

    // logo: official first, then infolot logo, then fallback
    let logoSrc = '';
    if (game.logo_official) {
      logoSrc = game.logo_official.startsWith('http') ? game.logo_official : LOGO_BASE + game.logo_official;
    } else if (game.logo) {
      logoSrc = game.logo.startsWith('http') ? game.logo : LOGO_BASE + game.logo;
    }

    // days
    const daysStr = game.id_days
      ? game.id_days.split(',').map(d => DAY_NAMES[d.trim()] || d).join(' · ')
      : '';

    // date
    const dateStr = item.date
      ? new Date(item.date + 'T00:00:00').toLocaleDateString('es-ES',
          { weekday:'long', day:'numeric', month:'long' })
      : '';

    // amount: integer, no decimals
    const amount = Math.floor(parseFloat(item.jackpot) || 0).toLocaleString('es-ES');

    // addons
    let addonsHtml = '';
    if (item.addons && item.addons.length) {
      addonsHtml = '<div class="card-addons">' +
        item.addons.map(a => {
          const aAmt = Math.floor(parseFloat(a.jackpot)||0).toLocaleString('es-ES');
          return `<div class="addon-pill">
            <span class="addon-name">${esc(a.name)}</span>
            <span class="addon-amt">+ ${aAmt} €</span>
          </div>`;
        }).join('') + '</div>';
    }

    const card = document.createElement('div');
    card.className = 'jackpot-card';
    card.style.animationDelay = `${i * 45}ms`;
    card.innerHTML = `
      <div class="card-bar" style="background:${barClr}"></div>
      <div class="card-header">
        ${logoSrc ? `<img class="card-logo" src="${esc(logoSrc)}" alt="" onerror="this.style.display='none'">` : ''}
        <div class="card-name">${esc(item.name || game.name || '—')}</div>
        ${daysStr ? `<div class="card-days">${daysStr}</div>` : ''}
      </div>
      <div class="card-amount-wrap">
        <div class="card-amount" style="color:${amtClr}">
          <span class="card-currency">€</span>${amount}
        </div>
      </div>
      <div class="card-footer">
        ${dateStr ? `<div class="card-date">${dateStr}</div>` : ''}
        ${addonsHtml}
      </div>
    `;
    grid.appendChild(card);
  });

  // ── Responsive font size for amounts ──
  requestAnimationFrame(() => fitAmountFonts());
}

function fitAmountFonts() {
  const cards = document.querySelectorAll('.jackpot-card');
  cards.forEach(card => {
    const wrap = card.querySelector('.card-amount-wrap');
    const amt  = card.querySelector('.card-amount');
    if (!wrap || !amt) return;
    const avail = wrap.clientHeight * 0.85;
    let size = Math.min(avail, 80);
    size = Math.max(size, 24);
    amt.style.fontSize = size + 'px';
  });
}

// ════════════════════════════════════════════
//  LOAD ALL
// ════════════════════════════════════════════
async function loadAllData() {
  showLoading(true);
  await fetchPvInfo();
  await fetchGames();
  await fetchJackpots();
  showLoading(false);
}

async function refreshPvAndGames() {
  await fetchPvInfo();
  await fetchGames();
}

// ════════════════════════════════════════════
//  TIMERS
// ════════════════════════════════════════════
function setupTimers(cfg) {
  Object.values(timers).forEach(clearInterval);
  timers = {};
  if (cfg.refreshJackpots > 0)
    timers.j = setInterval(fetchJackpots, cfg.refreshJackpots * 60000);
  if (cfg.refreshPvInfo > 0)
    timers.p = setInterval(refreshPvAndGames, cfg.refreshPvInfo * 3600000);
}

// ════════════════════════════════════════════
//  UI HELPERS
// ════════════════════════════════════════════
function showLoading(show) {
  document.getElementById('loading').style.display = show ? 'flex' : 'none';
  document.getElementById('app').classList.toggle('visible', !show);
}
function setLoadingStep(msg) {
  document.getElementById('loading-step').textContent = msg;
}
function setStatus(msg, type) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className   = type || '';
}
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ════════════════════════════════════════════
//  NAVIGATION
// ════════════════════════════════════════════
function openMenu() {
  showMenu();
  document.getElementById('overlay').classList.add('visible');
  document.getElementById('menu-version').textContent =
    `v${APP_VERSION} · r${APP_REVISION} · Infolot TV App`;
}
function closeOverlay() {
  document.getElementById('overlay').classList.remove('visible');
}
function showMenu() {
  document.getElementById('modal-menu').style.display   = '';
  document.getElementById('modal-config').style.display = 'none';
  document.getElementById('modal-diag').style.display   = 'none';
}
function showConfig() {
  fillConfigForm(loadConfig());
  document.getElementById('modal-menu').style.display   = 'none';
  document.getElementById('modal-config').style.display = '';
  document.getElementById('modal-diag').style.display   = 'none';
}
function showDiag() {
  document.getElementById('modal-menu').style.display   = 'none';
  document.getElementById('modal-config').style.display = 'none';
  document.getElementById('modal-diag').style.display   = '';
}
function goHome()        { closeOverlay(); }
function manualRefresh() { closeOverlay(); loadAllData(); }

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' || e.key === 'Back') closeOverlay();
});

window.addEventListener('resize', () => {
  if (document.querySelectorAll('.jackpot-card').length) fitAmountFonts();
});

// ════════════════════════════════════════════
//  DIAGNOSTICO
// ════════════════════════════════════════════
function diagLog(msg, color) {
  const el   = document.getElementById('diag-output');
  const line = document.createElement('div');
  line.style.color = color || '#8ab4c8';
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}
function diagClear() {
  document.getElementById('diag-output').innerHTML = '';
}
async function diagRun(endpoint) {
  diagClear();
  const cfg = loadConfig();
  diagLog(`► Llamada via proxy: ${cfg.proxy}`, '#f0b429');
  diagLog(`  endpoint: ${endpoint}`, '#f0b429');
  diagLog(`  token:  ${cfg.token}`, '#5a7a8e');
  diagLog(`  pass:   ${'•'.repeat(cfg.pass.length)}`, '#5a7a8e');
  diagLog(`  app_id: ${cfg.appid}`, '#5a7a8e');
  diagLog('Enviando petición...', '#3a5a6e');
  try {
    const body = { _endpoint: endpoint, token: cfg.token, pass: cfg.pass, app_id: cfg.appid };
    const t0   = Date.now();
    const resp = await fetch(cfg.proxy.replace('http://','https://'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const ms   = Date.now() - t0;
    const text = await resp.text();
    diagLog(`✓ Respuesta en ${ms}ms — HTTP ${resp.status}`, resp.ok ? '#27c97a' : '#e05c2a');
    diagLog('', '');
    try {
      const json   = JSON.parse(text);
      const pretty = JSON.stringify(json, null, 2).split('\n');
      const MAX    = 120;
      pretty.slice(0, MAX).forEach(l => diagLog(l, '#b0ccd8'));
      if (pretty.length > MAX)
        diagLog(`... (${pretty.length-MAX} líneas más en consola)`, '#3a5a6e');
      console.log(`[Diag] ${endpoint}:`, json);
    } catch { diagLog(text.substring(0,2000), '#b0ccd8'); }
  } catch(e) {
    diagLog(`✗ Error: ${e.message}`, '#e05c2a');
  }
}

// ════════════════════════════════════════════
//  BOOT
// ════════════════════════════════════════════
(function boot() {
  const cfg = loadConfig();

  if (cfg.orient === null) {
    cfg.orient = detectOrientation();
    persistConfig(cfg);
  }

  applyTheme(cfg.theme);
  applyOrientation(cfg.orient);
  applyBrandColors(cfg.color1, cfg.color2);

  document.getElementById('app-ver').textContent = `v${APP_VERSION} · r${APP_REVISION}`;

  updateClock();
  setInterval(updateClock, 30000);

  setupTimers(cfg);
  loadAllData();
})();
</script>
