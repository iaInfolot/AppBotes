<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Botes</title>
<style>
/* ════════════════════════════════════════════════════════════
   ÍNDICE
   1. Variables de tema y reset base
   2. Loading / App shell
   3. Header
   4. Main content / Views
   5. Jackpots (vista Botes)
   6. Results (vista Resultados)
   7. Overlay & Modals (menú, config, diagnóstico)
   8. Vista mixta
   9. Auto-rotate bar
  10. Orientación vertical
  11. Foco D-Pad
  12. Animaciones
   ════════════════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@300;400;600;700&display=swap');

/* ── 1. VARIABLES DE TEMA Y RESET ── */
:root {
  --pv-primary:#f0b429; --pv-secondary:#e05c2a;
  --bg:#07090e; --surface:#0f1319; --card:#131820; --card2:#171e28;
  --border:#1d2738; --text:#e6ecf3; --text2:#8a9bb0; --muted:#3d4f62;
  --success:#27c97a; --radius:14px; --shadow:0 4px 24px rgba(0,0,0,.45);
  --font-display:'Bebas Neue',sans-serif; --font-ui:'Barlow Condensed',sans-serif; --font-body:'Barlow',sans-serif;
  --fs-base:clamp(12px,1.2vw,18px);
  --fs-xs:calc(var(--fs-base)*.68); --fs-sm:calc(var(--fs-base)*.82);
  --fs-lg:calc(var(--fs-base)*1.3); --fs-xl:calc(var(--fs-base)*1.7);
  --hdr-h:clamp(48px,6vh,68px);
}
body.light{--bg:#eef0f4;--surface:#fff;--card:#fff;--card2:#f4f6f9;--border:#d8dde6;--text:#111827;--text2:#4b5563;--muted:#9ca3af;--shadow:0 4px 24px rgba(0,0,0,.10);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow:hidden;transition:background .3s,color .3s;}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:200;}
#loading-logo{font-family:var(--font-display);font-size:clamp(1.8rem,3vw,3rem);letter-spacing:6px;color:var(--pv-primary);}
#loading-step{font-family:var(--font-ui);font-size:var(--fs-sm);letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
.spinner{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--pv-primary);border-radius:50%;animation:spin .7s linear infinite;}

/* APP SHELL */
#app{display:none;width:100vw;height:100vh;flex-direction:column;}
#app.visible{display:flex;}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;padding:clamp(6px,1vh,10px) clamp(14px,2vw,28px);border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface);gap:clamp(8px,1.2vw,16px);min-height:var(--hdr-h);max-height:var(--hdr-h);}
.header-left{display:flex;align-items:center;gap:clamp(8px,1vw,14px);min-width:0;flex:1;}
#pv-logo{height:clamp(28px,4vh,42px);width:auto;max-width:140px;object-fit:contain;display:none;flex-shrink:0;}
.title-block{min-width:0;}
#pv-name{font-family:var(--font-display);font-size:clamp(1.2rem,1.8vw,2rem);letter-spacing:3px;color:var(--pv-primary);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#pv-tagline{font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--text2);letter-spacing:2px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#pv-tagline span{color:var(--pv-primary);}
#section-label-header{font-family:var(--font-ui);font-size:var(--fs-xs);font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--muted);display:none;align-items:center;gap:6px;padding-left:clamp(10px,1.5vw,20px);border-left:1px solid var(--border);margin-left:clamp(4px,.8vw,10px);white-space:nowrap;}
#section-label-header::before{content:'';display:inline-block;width:5px;height:5px;background:var(--pv-primary);border-radius:50%;flex-shrink:0;}
.header-right{display:flex;align-items:center;gap:clamp(6px,1vw,12px);flex-shrink:0;}
#demo-badge{display:none;background:#ca8a04;color:#000;font-family:var(--font-ui);font-size:var(--fs-xs);font-weight:700;letter-spacing:2px;padding:2px 8px;border-radius:4px;text-transform:uppercase;flex-shrink:0;}
#header-meta{display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
#last-update{font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--muted);letter-spacing:1px;white-space:nowrap;}
#app-ver{font-family:var(--font-ui);font-size:calc(var(--fs-xs)*.9);color:var(--muted);opacity:.6;letter-spacing:1px;white-space:nowrap;}
#status-msg{font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--muted);letter-spacing:1px;white-space:nowrap;}
#menu-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:clamp(5px,.7vh,8px) clamp(10px,1.2vw,18px);border-radius:8px;font-family:var(--font-ui);font-size:var(--fs-sm);letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:border-color .2s,color .2s;white-space:nowrap;}
#menu-btn:hover{border-color:var(--pv-primary);color:var(--pv-primary);}
.view-tabs{display:none;} .view-tab{display:none;} #clock{display:none;}
.accent-line{height:2px;background:linear-gradient(90deg,var(--pv-primary) 0%,var(--pv-secondary) 40%,transparent 80%);flex-shrink:0;}

/* MAIN CONTENT */
#main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:clamp(6px,.8vh,10px) clamp(14px,2vw,24px) clamp(6px,.8vh,10px);min-height:0;}

/* VIEWS */
.view{display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0;}
.view.active{display:flex;flex:1;min-height:0;animation:viewIn .2s ease both;}

/* ══ JACKPOTS ══ */
#jackpots-grid{flex:1;display:grid;gap:clamp(6px,.8vw,12px);overflow:hidden;min-height:0;}
.jackpot-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:clamp(10px,1.2vh,16px) clamp(12px,1.2vw,18px);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:var(--shadow);animation:fadeUp .35s ease both;transition:transform .2s,box-shadow .2s,border-color .2s;min-height:0;}
.jackpot-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.35);border-color:var(--pv-primary);}
.jackpot-card.is-highest{border-color:var(--pv-primary);box-shadow:0 0 0 2px var(--pv-primary),0 8px 32px rgba(0,0,0,.4);}
.jackpot-card.is-highest::after{content:'★ MAYOR BOTE';position:absolute;top:8px;right:12px;font-family:var(--font-ui);font-size:var(--fs-xs);font-weight:700;letter-spacing:2px;color:var(--pv-primary);animation:pulseLabel 2s ease-in-out infinite;}
.jackpot-card.is-next{border-color:var(--pv-secondary);box-shadow:0 0 0 2px var(--pv-secondary),0 8px 32px rgba(0,0,0,.4);}
.jackpot-card.is-next:not(.is-highest)::after{content:'⚡ PRÓXIMO SORTEO';position:absolute;top:8px;right:12px;font-family:var(--font-ui);font-size:var(--fs-xs);font-weight:700;letter-spacing:2px;color:var(--pv-secondary);animation:pulseLabel 2s ease-in-out infinite;}
.card-bar{position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--radius) var(--radius) 0 0;}
.card-header{display:flex;align-items:center;gap:clamp(6px,.8vw,12px);margin-bottom:clamp(4px,.5vh,8px);flex-shrink:0;}
.card-logo{width:clamp(26px,3vh,38px);height:clamp(26px,3vh,38px);object-fit:contain;border-radius:6px;flex-shrink:0;}
.card-name{font-family:var(--font-ui);font-size:var(--fs-lg);font-weight:700;letter-spacing:.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;line-height:1.1;}
.card-amount-wrap{flex:1;display:flex;align-items:center;justify-content:flex-end;min-height:0;padding-right:4px;}
.card-amount{font-family:var(--font-display);letter-spacing:1px;line-height:1;text-align:right;display:flex;flex-direction:column;align-items:flex-end;}
.card-amount-number{display:block;line-height:1;}
.card-currency{font-size:.5em;opacity:.65;margin-right:2px;vertical-align:super;}
.card-amount-label{font-family:var(--font-ui);font-size:.28em;font-weight:700;letter-spacing:4px;opacity:.75;line-height:1.2;text-align:right;}
.card-footer{flex-shrink:0;margin-top:clamp(4px,.5vh,8px);display:flex;align-items:flex-end;justify-content:space-between;gap:8px;}
.card-footer-left{display:flex;flex-direction:column;gap:3px;min-width:0;}
.card-date{font-family:var(--font-ui);font-size:var(--fs-sm);font-weight:600;color:var(--text2);letter-spacing:.5px;}
.card-addons{display:flex;flex-wrap:wrap;gap:3px;}
.addon-pill{display:flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:2px 8px;font-family:var(--font-ui);font-size:var(--fs-xs);}
.addon-name{color:var(--text2);} .addon-amt{color:var(--success);font-weight:700;}
.card-countdown{font-family:var(--font-ui);font-size:var(--fs-sm);font-weight:600;letter-spacing:1px;color:var(--text2);text-align:right;white-space:nowrap;flex-shrink:0;}
.card-countdown.urgent{color:var(--pv-secondary);animation:pulseLabel 1s ease-in-out infinite;}
.card-countdown.soon{color:var(--pv-primary);}
#empty-state{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:14px;color:var(--muted);}
#empty-state .ei{font-size:3rem;}
#empty-state p{font-family:var(--font-ui);font-size:var(--fs-sm);letter-spacing:4px;text-transform:uppercase;}

/* ══ RESULTS ══ */
#results-scroll{flex:1;overflow:hidden;}
#results-grid{display:grid;gap:clamp(6px,.8vw,10px);height:100%;overflow:hidden;}
.result-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;animation:fadeUp .35s ease both;}
.result-block.result-pending{opacity:.7;}
.result-block-header{display:flex;align-items:center;gap:6px;padding:clamp(4px,.5vh,6px) clamp(6px,.8vw,10px);border-bottom:1px solid var(--border);flex-shrink:0;}
.result-block-bar{width:3px;height:clamp(18px,2.5vh,26px);border-radius:2px;flex-shrink:0;}
.result-block-logo{width:clamp(16px,2.2vh,24px);height:clamp(16px,2.2vh,24px);object-fit:contain;flex-shrink:0;}
.result-block-name{font-family:var(--font-ui);font-size:var(--fs-sm);font-weight:700;letter-spacing:.5px;color:var(--text);flex:1;}
.rb-body{padding:clamp(4px,.5vh,6px) clamp(6px,.8vw,10px);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;}
.ball-row{display:flex;flex-wrap:nowrap;align-items:center;gap:2px;width:100%;}
.ball-sized{display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-ui);font-weight:700;flex-shrink:0;}
.ball-sep{display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--text);background:var(--border);border-radius:3px;padding:1px 3px;margin:0 1px;flex-shrink:0;line-height:1;font-weight:700;opacity:.9;}

/* ══ OVERLAY & MODALS ══ */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);z-index:100;align-items:center;justify-content:center;}
#overlay.visible{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:clamp(16px,2vh,28px) clamp(16px,2vw,32px);position:relative;box-shadow:0 24px 64px rgba(0,0,0,.5);}
.modal h2{font-family:var(--font-display);font-size:clamp(1.3rem,2vw,1.8rem);letter-spacing:3px;color:var(--pv-primary);margin-bottom:3px;}
.modal-sub{font-size:var(--fs-xs);color:var(--muted);margin-bottom:clamp(12px,1.5vh,20px);font-family:var(--font-ui);letter-spacing:3px;text-transform:uppercase;}
.close-btn{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;transition:color .2s;line-height:1;}
.close-btn:hover{color:var(--text);}
.btn{font-family:var(--font-ui);font-size:var(--fs-sm);font-weight:600;letter-spacing:2px;text-transform:uppercase;border:none;border-radius:8px;padding:clamp(7px,.8vh,10px) clamp(12px,1.2vw,20px);cursor:pointer;transition:opacity .2s,transform .1s;white-space:nowrap;}
.btn:hover{opacity:.85;} .btn:active{transform:scale(.97);}
.btn-primary{background:var(--pv-primary);color:#000;}
.btn-secondary{background:var(--card);border:1px solid var(--border);color:var(--text);}
.btn-danger{background:#b03020;color:#fff;margin-left:auto;}
.menu-list{list-style:none;display:flex;flex-direction:column;gap:7px;margin-bottom:20px;}
.menu-list li button{width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px 16px;font-family:var(--font-ui);font-size:1rem;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:border-color .2s,color .2s;}
.menu-list li button:hover{border-color:var(--pv-primary);color:var(--pv-primary);}
.menu-icon{font-size:1.1rem;width:24px;text-align:center;}
.app-version{font-size:var(--fs-xs);color:var(--muted);font-family:var(--font-ui);letter-spacing:1px;}

/* ══ CONFIG MODAL — 3-column no-scroll ══ */
#modal-config{width:90vw;max-width:90vw;height:88vh;max-height:88vh;overflow:hidden;flex-direction:column;padding:clamp(14px,1.8vh,22px) clamp(16px,2vw,28px);}
.cfg-grid{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:clamp(10px,2vw,24px);overflow:hidden;align-items:start;}
.cfg-col{display:flex;flex-direction:column;gap:0;}
.cfg-divider{font-family:var(--font-ui);font-size:clamp(8px,.65vw,11px);font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--pv-primary);margin:clamp(8px,1vh,14px) 0 clamp(5px,.6vh,9px);display:flex;align-items:center;gap:6px;}
.cfg-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.cfg-divider:first-child{margin-top:0;}
.form-group{margin-bottom:clamp(5px,.6vh,9px);}
.form-group label{display:block;font-family:var(--font-ui);font-size:clamp(8px,.65vw,11px);letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.form-group input,.form-group select{width:100%;background:var(--card);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--font-body);font-size:clamp(10px,.85vw,14px);padding:clamp(4px,.5vh,7px) clamp(6px,.7vw,10px);outline:none;transition:border-color .2s;appearance:none;}
.form-group input:focus,.form-group select:focus{border-color:var(--pv-primary);}
.color-row{display:flex;align-items:center;gap:6px;}
.color-row input[type="color"]{width:32px;height:28px;padding:2px 3px;border-radius:5px;cursor:pointer;flex-shrink:0;}
.color-row input[type="text"]{flex:1;font-family:monospace;}
.cfg-actions{display:flex;gap:8px;padding-top:clamp(8px,1vh,14px);border-top:1px solid var(--border);flex-shrink:0;align-items:center;}

/* ══ DIAGNOSTIC ══ */
#diag-output{background:#050709;border:1px solid var(--border);border-radius:8px;padding:12px;font-family:'Courier New',monospace;font-size:var(--fs-xs);line-height:1.6;color:#8ab4c8;max-height:50vh;overflow-y:auto;white-space:pre-wrap;word-break:break-all;}

/* ══ MIXED VIEW ══ */
#view-mixed{display:none;flex-direction:row;overflow:hidden;gap:clamp(6px,.8vw,12px);}
#view-mixed.active{display:flex;}
#mixed-jackpots,#mixed-results{display:flex;flex-direction:column;overflow:hidden;min-height:0;min-width:0;}
#mixed-jackpots{flex:0.8;}
#mixed-results{flex:1.2;}
.mixed-label{font-family:var(--font-ui);font-size:var(--fs-xs);font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--muted);margin-bottom:clamp(5px,.6vh,9px);flex-shrink:0;display:flex;align-items:center;gap:6px;}
.mixed-label::before{content:'';display:inline-block;width:4px;height:4px;background:var(--pv-primary);border-radius:50%;}
#mixed-jackpots-grid{flex:1;display:grid;gap:clamp(5px,.6vw,9px);overflow:hidden;min-height:0;}
#mixed-results-scroll{flex:1;overflow:hidden;min-height:0;}
#mixed-results-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(5px,.6vw,9px);align-items:start;overflow:hidden;}

/* ══ AUTO-ROTATE BAR ══ */
#rotate-bar{position:fixed;bottom:0;left:0;height:3px;background:var(--pv-secondary);width:100%;display:none;z-index:50;transform-origin:left;}

/* ══ VERTICAL ORIENTATION ══ */
body.orient-v header{padding:clamp(6px,.8vh,10px) clamp(10px,1.5vw,16px);}
body.orient-v #main-content{padding:clamp(6px,.8vh,10px) clamp(10px,1.5vw,14px);}

/* ══ D-PAD FOCUS ══ */
button:focus,select:focus,input:focus,[tabindex]:focus{outline:4px solid var(--pv-primary)!important;outline-offset:3px;box-shadow:0 0 0 6px rgba(240,180,41,.25)!important;}
.menu-list li button:focus{border-color:var(--pv-primary)!important;color:var(--pv-primary)!important;background:var(--card2)!important;}
.btn:focus{outline:4px solid var(--pv-primary)!important;box-shadow:0 0 0 6px rgba(240,180,41,.25)!important;transform:scale(1.03);}
.form-group input:focus,.form-group select:focus{border-color:var(--pv-primary)!important;box-shadow:0 0 0 3px rgba(240,180,41,.3)!important;}

/* ══ ANIMATIONS ══ */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseLabel{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes viewIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body class="orient-h">

<div id="loading">
  <div id="loading-logo">Botes</div>
  <div class="spinner"></div>
  <div id="loading-step">Iniciando...</div>
</div>

<div id="app">
  <header>
    <div class="header-left">
      <img id="pv-logo" src="" alt="">
      <div class="title-block">
        <div id="pv-name" style="display:none">—</div>
        <div id="pv-tagline" style="display:none"><span id="pv-url"></span></div>
      </div>
      <div id="section-label-header"><span id="section-label-text"></span></div>
    </div>
    <div class="header-right">
      <div class="view-tabs">
        <button class="view-tab active" id="tab-jackpots" onclick="switchView('jackpots')"></button>
        <button class="view-tab" id="tab-results" onclick="switchView('results')"></button>
        <button class="view-tab" id="tab-mixed" onclick="switchView('mixed')"></button>
      </div>
      <span id="demo-badge">DEMO</span>
      <div id="header-meta">
        <span id="last-update"></span>
        <span id="app-ver"></span>
      </div>
      <span id="status-msg"></span>
      <div id="clock">--:--</div>
      <button id="menu-btn" onclick="openMenu()">☰ Menú</button>
    </div>
  </header>
  <div class="accent-line"></div>

  <div id="main-content">
    <div class="view active" id="view-jackpots">
      <div id="jackpots-grid"></div>
      <div id="empty-state"><div class="ei">🎰</div><p>No hay botes disponibles</p></div>
    </div>

    <div class="view" id="view-mixed">
      <div id="mixed-jackpots">
        <div class="mixed-label">Próximos Botes</div>
        <div id="mixed-jackpots-grid"></div>
      </div>
      <div id="mixed-results">
        <div class="mixed-label">Resultados</div>
        <div id="mixed-results-scroll"><div id="mixed-results-grid"></div></div>
      </div>
    </div>

    <div class="view" id="view-results">
      <div id="results-scroll" style="height:100%;overflow:hidden">
        <div id="results-grid" style="height:100%"></div>
      </div>
    </div>
  </div>
</div>

<div id="rotate-bar"></div>

<div id="overlay">

  <div class="modal" id="modal-menu" style="width:480px;max-width:95vw;max-height:90vh;overflow-y:auto;">
    <button class="close-btn" onclick="closeOverlay()">✕</button>
    <h2>Menú</h2>
    <div class="modal-sub">Navegación</div>
    <ul class="menu-list">
      <li><button onclick="switchView('jackpots');closeOverlay()"><span class="menu-icon">🏆</span>Botes</button></li>
      <li><button onclick="switchView('results');closeOverlay()"><span class="menu-icon">📋</span>Resultados</button></li>
      <li><button onclick="switchView('mixed');closeOverlay()"><span class="menu-icon">⊞</span>Vista Mixta</button></li>
      <li><button onclick="showConfig()"><span class="menu-icon">⚙️</span>Configuración</button></li>
      <li><button onclick="manualRefresh()"><span class="menu-icon">🔄</span>Actualizar datos</button></li>
    </ul>
    <div class="app-version" id="menu-version"></div>
  </div>

// ── 3. CONFIG ─────────────────────────────────────────────────
function loadConfig(){
  try{
    const s=localStorage.getItem(STORAGE_KEY);
    if(!s) return {...DEFAULTS};
    const saved=JSON.parse(s);
    return {
      ...DEFAULTS,
      theme:saved.theme||DEFAULTS.theme,
      orient:saved.orient!==undefined?saved.orient:DEFAULTS.orient,
      defaultView:saved.defaultView||DEFAULTS.defaultView,
      refreshJackpots:saved.refreshJackpots||DEFAULTS.refreshJackpots,
      refreshPvInfo:saved.refreshPvInfo||DEFAULTS.refreshPvInfo,
      autoRotate:typeof saved.autoRotate==='boolean'?saved.autoRotate:DEFAULTS.autoRotate,
      autoRotateInterval:saved.autoRotateInterval||DEFAULTS.autoRotateInterval,
      demoMode:typeof saved.demoMode==='boolean'?saved.demoMode:DEFAULTS.demoMode,
    };
  }catch{return{...DEFAULTS};}
}

function persistConfig(cfg){localStorage.setItem(STORAGE_KEY,JSON.stringify(cfg));}

  persistConfig(cfg);

// ── 4. APARIENCIA / TEMA ──────────────────────────────────────
function detectOrientation(){
  try{const t=screen.orientation?screen.orientation.type:'';if(t.includes('portrait'))return'v';if(t.includes('landscape'))return'h';return window.innerHeight>window.innerWidth?'v':'h';}catch{return'h';}
}
function applyTheme(t){document.body.classList.toggle('light',t==='light');}
function applyOrientation(o){document.body.classList.remove('orient-h','orient-v');document.body.classList.add('orient-'+(o||'h'));}
function applyBrandColors(c1,c2){const r=document.documentElement.style;r.setProperty('--pv-primary',c1||DEFAULTS.color1);r.setProperty('--pv-secondary',c2||DEFAULTS.color2);}
function applyPvUrl(pvurl){
  const tagline=document.getElementById('pv-tagline');
  const urlEl=document.getElementById('pv-url');
  if(!tagline||!urlEl) return;
  const display=pvurl?pvurl.replace(/^https?:\/\//,''):'';
  urlEl.textContent=display;
  tagline.style.display=display?'':'none';
}
function updateDemoBadge(cfg){
  const b=document.getElementById('demo-badge');
  if(b) b.style.display=cfg.demoMode?'':'none';

// ── 5. RELOJ ──────────────────────────────────────────────────
function updateClock(){
  const n=new Date(),el=document.getElementById('clock');
  if(el) el.textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
}

// ── 6. HELPERS DE SEMANA / FECHA ──────────────────────────────
function getWeekBounds(refDate){
  const d=new Date(refDate),day=d.getDay(),diffToMon=day===0?-6:1-day;
  const mon=new Date(d);mon.setDate(d.getDate()+diffToMon);mon.setHours(0,0,0,0);
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);sun.setHours(23,59,59,999);
  return{mon,sun};
}
function toYMD(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function isCurrentWeekResults(){
  const now=new Date();
  return !(now.getDay()===1&&now.getHours()<14);
}
function getResultsWeekRef(){
  const cfg=loadConfig(),now=new Date();
  if(cfg.demoMode||!isCurrentWeekResults()){
    const prev=new Date(now);prev.setDate(now.getDate()-7);return prev;
  }
  return now;
}
function resultsWeekLabel(){
  const ref=getResultsWeekRef(),{mon,sun}=getWeekBounds(ref);
  const fmt=d=>d.toLocaleDateString('es-ES',{day:'numeric',month:'short'});
  return `Resultados Semana ${getISOWeek(ref)} · ${fmt(mon)} – ${fmt(sun)}`;
}
function getISOWeek(d){
  const date=new Date(d);date.setHours(0,0,0,0);
  date.setDate(date.getDate()+3-(date.getDay()+6)%7);
  const week1=new Date(date.getFullYear(),0,4);
  return 1+Math.round(((date-week1)/86400000-3+(week1.getDay()+6)%7)/7);
}

// ── 7. LLAMADAS AL WEBSERVICE ─────────────────────────────────
async function wsCall(endpoint,extra={}){
  const cfg=loadConfig();
  if(!cfg.token||!cfg.appid||!cfg.pass){
    throw new Error('Missing credentials — aborting '+endpoint);
  }
  const url=`${cfg.url}/ws/${endpoint}`;
  const body={token:cfg.token,pass:cfg.pass,app_id:cfg.appid,...extra};
  console.log('[wsCall]',endpoint,'appid:',cfg.appid.substring(0,8));
  const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const json=await resp.json();
  if(json.error) throw new Error(json.error);
  return json.data;
}

async function fetchPvInfo(){
  try{
    const cfg=loadConfig();
    console.log('[WS] pv-info via',cfg.url,'appid:',cfg.appid.substring(0,8)+'...');
    pvData=await wsCall('pv-info')||{};
    applyPvInfo(pvData);
  }catch(e){
    console.error('[WS] pv-info FAILED:',e.message);
    setLoadingStep('pv-info falló: '+e.message);
    const nameEl=document.getElementById('pv-name');
    if(nameEl){nameEl.textContent='Mi Lotería';nameEl.style.display='';}
  }
}

function applyPvInfo(pv){
  const cfg=loadConfig();
  const name=(pv?.company?.name_comercial||pv?.company?.name_social||'').trim()||'Mi Lotería';
  const nameEl=document.getElementById('pv-name');
  const logoEl=document.getElementById('pv-logo');
  document.getElementById('loading-logo').textContent=name;
  document.title=name+' · Botes';
  if(nameEl){nameEl.textContent=name;nameEl.style.display='';}
  const css=pv?.css||{};
  applyBrandColors(css.color_tema||cfg.color1||DEFAULTS.color1,css.secondary_color_tema||cfg.color2||DEFAULTS.color2);
  const media=pv?.media||{};
  const logoPath=media.logo||media.logo_oficial||media.logo_small||'';
  if(logoEl&&logoPath){
    const logoUrl=logoPath.startsWith('http')?logoPath:LOGO_BASE+logoPath;
    logoEl.style.display='none';
    console.log('[Logo] Attempting:',logoUrl);
    let settled=false;
    const logoTimer=setTimeout(()=>{
      if(!settled){settled=true;console.warn('[Logo] Timeout:',logoUrl);logoEl.style.display='none';if(nameEl)nameEl.style.display='';}
    },3000);
    logoEl.onload=()=>{
      if(settled) return;settled=true;clearTimeout(logoTimer);
      console.log('[Logo] Loaded OK:',logoUrl);logoEl.style.display='';if(nameEl)nameEl.style.display='none';
    };
    logoEl.onerror=()=>{
      if(settled) return;settled=true;clearTimeout(logoTimer);
      console.warn('[Logo] Failed:',logoUrl);logoEl.style.display='none';if(nameEl)nameEl.style.display='';
    };
    logoEl.src=logoUrl;
  } else if(logoEl){
    logoEl.style.display='none';
  }
  applyPvUrl((pv?.url?.main||pv?.url?.web||cfg.pvurl||'').trim());
}

// ── LAST-RESULTS ─────────────────────────────────────────────
async function fetchResults(){
  setStatus('Actualizando resultados...','');
  try{
    const cfg=loadConfig();
    const ref=getResultsWeekRef();
    const {mon,sun}=getWeekBounds(ref);
    const monStr=toYMD(mon),sunStr=toYMD(sun);
    const gameIds=Object.keys(gamesMap);
    if(!gameIds.length){setStatus('Sin juegos','error');return;}
    console.log('[Results] ref:',toYMD(ref),'mon:',monStr,'sun:',sunStr);
    setLoadingStep(cfg.demoMode?'Cargando resultados (DEMO)...':'Cargando resultados semana...');
    const calls=gameIds.map(id=>wsCall('last-game-results',{id_game:parseInt(id),limit:20})
      .then(d=>Array.isArray(d)?d:[]).catch(()=>[]));
    const results=await Promise.all(calls);
    const todayStr=toYMD(new Date());
    const flat=[];
    results.forEach((gameResults,idx)=>{
      const id=parseInt(gameIds[idx]);
      gameResults.forEach(r=>{
        if(r.date&&((r.date>=monStr&&r.date<=sunStr)||r.date===todayStr))
          flat.push({...r,id_game:id});
      });
    });
    console.log('[Results] flat:',flat.length,'draws');
    lastResultsData=flat;
    if(currentView==='mixed') renderMixedResults(lastResultsData);
    if(currentView==='results'){
      const el=document.getElementById('section-label-text'),w=document.getElementById('section-label-header');
      if(el) el.textContent=resultsWeekLabel();
      if(w) w.style.display='flex';
      renderResults(lastResultsData);
    }
    setStatus('Datos actualizados','ok');
  }catch(e){console.error('[Results]',e);setStatus('Error resultados: '+e.message,'error');}
}

// ── 8. RENDER — BOTES (JACKPOTS) ──────────────────────────────
function renderJackpots(data){
  countdownTimers.forEach(clearInterval);countdownTimers=[];
  const grid=document.getElementById('jackpots-grid'),empty=document.getElementById('empty-state');
  grid.innerHTML='';
  const items=data.filter(item=>!Object.keys(gamesMap).length||gamesMap[item.id_game]);
  if(!items.length){grid.style.display='none';empty.style.display='flex';return;}
  grid.style.display='';empty.style.display='none';
  const maxJ=Math.max(...items.map(i=>parseFloat(i.jackpot)||0));
  const minDate=items.reduce((m,i)=>(!i.date?m:(!m||i.date<m?i.date:m)),null);
  const isV=document.body.classList.contains('orient-v');
  const n=items.length;let cols,rows;
  if(isV){cols=1;rows=n;}
  else if(n<=2){cols=n;rows=1;}
  else if(n<=4){cols=2;rows=Math.ceil(n/2);}
  else if(n<=6){cols=3;rows=Math.ceil(n/3);}
  else if(n<=8){cols=4;rows=Math.ceil(n/4);}
  else if(n<=9){cols=3;rows=3;}
  else{cols=4;rows=Math.ceil(n/4);}
  grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  grid.style.gridTemplateRows=`repeat(${rows},1fr)`;
  items.forEach((item,i)=>{
    const game=gamesMap[item.id_game]||{};
    const barClr=game.fg_color||game.bg_color||'var(--pv-primary)';
    const rawAmtClr=game.jackpot_fg_color||'';
    const amtClr=(rawAmtClr&&rawAmtClr!=='#000000'&&rawAmtClr!=='#FFFFFF'&&rawAmtClr!=='#ffffff'&&rawAmtClr!=='#000')?rawAmtClr:'var(--pv-primary)';
    const jackpot=parseFloat(item.jackpot)||0;
    const millones=jackpot/1000000;
    let amountHtml;
    if(jackpot>=1000000){
      const milStr=Number.isInteger(millones)?millones.toString():millones.toFixed(1).replace('.',',');
      amountHtml=`<span class="card-amount-number">${milStr}</span><span class="card-amount-label">${millones===1?'MILLÓN DE EUROS':'MILLONES DE EUROS'}</span>`;
    } else {
      amountHtml=`<span class="card-amount-number">${Math.floor(jackpot).toLocaleString('es-ES')}</span><span class="card-amount-label">EUROS</span>`;
    }
    let logoSrc='';
    if(game.logo_official) logoSrc=game.logo_official.startsWith('http')?game.logo_official:LOGO_BASE+game.logo_official;
    else if(game.logo) logoSrc=game.logo.startsWith('http')?game.logo:LOGO_BASE+game.logo;
    const dateStr=item.date?new Date(item.date+'T00:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}):'';
    let addonsHtml='';
    if(item.addons&&item.addons.length){
      addonsHtml='<div class="card-addons">'+item.addons.map(a=>{
        const aAmt=Math.floor(parseFloat(a.jackpot)||0).toLocaleString('es-ES');
        return `<div class="addon-pill"><span class="addon-name">${esc(a.name)}</span><span class="addon-amt">+ ${aAmt} €</span></div>`;
      }).join('')+'</div>';
    }
    const cdId=`cd-${i}`;
    const card=document.createElement('div');
    card.className='jackpot-card'+(jackpot>0&&jackpot===maxJ?' is-highest':'')+(item.date&&item.date===minDate?' is-next':'');
    card.style.animationDelay=`${i*45}ms`;
    card.innerHTML=`
      <div class="card-bar" style="background:${barClr}"></div>
      <div class="card-header">
        ${logoSrc?`<img class="card-logo" src="${esc(logoSrc)}" alt="" onerror="hideImg(this)">` :''}
        <div class="card-name">${esc(item.name||game.name||'—')}</div>
      </div>
      <div class="card-amount-wrap">
        <div class="card-amount" style="color:${amtClr}">${amountHtml}</div>
      </div>
      <div class="card-footer">
        <div class="card-footer-left">
          ${dateStr?`<div class="card-date">${dateStr}</div>`:''}
          ${addonsHtml}
        </div>
        <div class="card-countdown" id="${cdId}"></div>
      </div>`;
    grid.appendChild(card);
    if(item.date) startCountdown(cdId,item.date,game);
  });
  jackpotsObserver.disconnect();
  jackpotsObserver.observe(grid);
  fitAmountFonts();
}

const jackpotsObserver=new ResizeObserver(()=>fitAmountFonts());

function startCountdown(elId,dateStr,game){
  let drawHour='20:00';
  try{const h=JSON.parse(game.draw_hours||'{}');const v=Object.values(h);if(v.length)drawHour=v[0];}catch{}
  const target=new Date(dateStr+'T'+drawHour+':00');
  function update(){
    const el=document.getElementById(elId);if(!el)return;
    const diff=target-new Date();
    if(diff<=0){el.textContent='Hoy';el.className='card-countdown urgent';return;}
    const days=Math.floor(diff/86400000),hours=Math.floor((diff%86400000)/3600000),mins=Math.floor((diff%3600000)/60000);
    let txt='',cls='card-countdown';
    if(days>1){txt=`${days}d ${hours}h`;}
    else if(days===1){txt=`${hours}h ${mins}m`;cls+=' soon';}
    else if(hours>0){txt=`${hours}h ${mins}m`;cls+=' soon';}
    else{txt=`${mins}m`;cls+=' urgent';}
    el.textContent=txt;el.className=cls;
  }
  update();
  const t=setInterval(update,30000);countdownTimers.push(t);
}

function fitAmountFonts(){
  document.querySelectorAll('.jackpot-card').forEach(card=>{
    const wrap=card.querySelector('.card-amount-wrap'),amt=card.querySelector('.card-amount');
    if(!wrap||!amt) return;
    let size=Math.min(wrap.clientHeight*.72,80);
    amt.style.fontSize=size+'px';
    while(amt.scrollWidth>wrap.clientWidth*.95&&size>18){size-=2;amt.style.fontSize=size+'px';}
  });
  const sizes=[];
  document.querySelectorAll('.jackpot-card .card-amount').forEach(amt=>sizes.push(parseFloat(amt.style.fontSize)||80));
  if(!sizes.length) return;
  const minSize=Math.min(...sizes);
  document.querySelectorAll('.jackpot-card .card-amount').forEach(amt=>amt.style.fontSize=minSize+'px');
}

// ── 9. RENDER — RESULTADOS ────────────────────────────────────
function renderResultsInto(data,grid,forceVertical){return _renderResults(data,grid,forceVertical);}
function renderResults(data){_renderResults(data,document.getElementById('results-grid'),false);}

function getGameType(game){
  if(game.id===21) return 'loto';
  if(game.is_link_match===1) return 'match';
  if(game.is_num_serie===1||game.is_num_fraction===1) return 'nacional';
  return 'loto';
}

function calcBSZ(nMain,nExtra,nComp,nRef,availW){
  const total=nMain+nExtra+nComp+nRef;
  const seps=(nExtra>0?1:0)+(nComp>0?1:0)+(nRef>0?1:0);
  const available=availW-seps*12-(total-1)*2;
  return Math.min(30,Math.max(18,Math.floor(available/Math.max(total,1))));
}
function mkBall(n,bg,fg,shape,sz){
  const br=shape==='sq'?'4px':'50%';
  return `<span class="ball-sized" style="width:${sz}px;height:${sz}px;background:${bg};color:${fg};border-radius:${br};font-size:${Math.max(9,Math.round(sz*.55))}px;">${n}</span>`;
}
function ballsArr(arr,bg,fg,shape,sz){
  if(!arr) return '';
  return (Array.isArray(arr)?arr:Object.values(arr)).map(n=>mkBall(n,bg,fg,shape,sz)).join('');
}
function bsep(label){return `<span class="ball-sep">${label}</span>`;}
function brow(html,nm,ne,nc,nr){return `<div class="ball-row" data-main="${nm}" data-extra="${ne}" data-comp="${nc}" data-ref="${nr}">${html}</div>`;}

function pendingHtml(game){
  const gt=getGameType(game);
  if(gt==='match'){
    const n=game.num_events||15;let h='<div style="opacity:.22">';
    for(let i=0;i<Math.min(n,15);i++)
      h+=`<div style="display:flex;align-items:center;justify-content:space-between;gap:3px;padding:1px 0;border-bottom:1px solid var(--border)"><div style="height:7px;background:var(--border);border-radius:3px;flex:1"></div><span style="background:var(--border);color:transparent;border-radius:3px;padding:1px 5px;font-size:var(--fs-xs)">·</span></div>`;
    return h+'</div>';
  }
  const nb=game.num_bet_per_game||6,ne=game.num_extra_per_bet||0;
  let r='';for(let i=0;i<nb;i++)r+=mkBall('·','var(--muted)','transparent','circle',22);
  if(ne>0){r+=bsep('+');for(let i=0;i<ne;i++)r+=mkBall('·','var(--muted)','transparent','sq',22);}
  return `<div style="font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--muted);font-style:italic;margin-bottom:3px">Pendiente</div><div style="opacity:.22">${brow(r,nb,ne,0,0)}</div>`;
}

function buildBlockHTML(gameId,draws,availW){
    const game=gamesMap[gameId]||{},gt=getGameType(game);
    const barClr=game.fg_color||game.bg_color||'var(--pv-primary)';
    const numBg=game.number_bg_color||'#1a2535',numFg=game.number_fg_color||'#fff';
    const _extBgRaw=game.extra_bg_color||'#c8a000';
    const _extBgIsLight=_extBgRaw&&(/^#[ef][0-9a-f]/i.test(_extBgRaw)||_extBgRaw.toLowerCase()==='#ffffff');
    const extBg=_extBgIsLight?(game.number_bg_color||'#c8a000'):_extBgRaw;
    const extFg=_extBgIsLight?'#fff':(game.extra_fg_color||'#000');
    const compBg=game.num_complementary_bg_color||'#e08020',compFg=game.num_complementary_fg_color||'#fff';
    const _refBgRaw=game.num_refund_bg_color||'#607080';
    const _refBgIsLight=_refBgRaw&&(/^#[ef][0-9a-f]/i.test(_refBgRaw)||_refBgRaw.toLowerCase()==='#ececec'||_refBgRaw.toLowerCase()==='#ffffff');
    const refBg=_refBgIsLight?'#607080':_refBgRaw,refFg=_refBgIsLight?'#fff':(game.num_refund_fg_color||'#fff');
    let logoSrc='';
    if(game.logo_official) logoSrc=game.logo_official.startsWith('http')?game.logo_official:LOGO_BASE+game.logo_official;
    else if(game.logo) logoSrc=game.logo.startsWith('http')?game.logo:LOGO_BASE+game.logo;

    let bodyHtml='';
    if(!draws||!draws.length){
      bodyHtml=pendingHtml(game);
    } else if(gt==='loto'){
      const COMPACT_SPACING_IDS=[4]; // Bonoloto: muchos sorteos apilados, necesita ir más ajustado. LotoTurf ya tiene hueco de sobra.
      const isCompact=COMPACT_SPACING_IDS.includes(gameId);
      const headerMB=isCompact?'2px':'6px', drawMB=isCompact?'3px':'8px', drawPB=isCompact?'3px':'6px';
      const hasE=game.num_extra_per_bet>0,hasC=game.is_num_complementary===1,hasR=game.is_num_refund===1,hasCA=game.is_code_a===1;
      const fd=draws[0]||{};
      const nMain=Array.isArray(fd.bet)?fd.bet.length:(game.num_bet_per_game||6);
      const nExtra=hasE?(Array.isArray(fd.extra)?fd.extra.length:(game.num_extra_per_bet||0)):0;
      const nComp=hasC&&fd.other?.complementary?.length?1:0;
      const nRef=hasR&&fd.other?.refund!=null?1:0;
      const bsz=calcBSZ(nMain,nExtra,nComp,nRef,availW||200);
      draws.forEach((r,ri)=>{
        const d=new Date(r.date+'T12:00:00');
        const fdStr=d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
        let row=ballsArr(r.bet,numBg,numFg,'circle',bsz);
        if(hasE) row+=bsep('+')+ballsArr(r.extra,extBg,extFg,'sq',bsz);
        if(hasC&&r.other?.complementary?.length) row+=bsep('C')+ballsArr(r.other.complementary,compBg,compFg,'circle',bsz);
        if(hasR&&r.other?.refund!=null) row+=bsep('R')+mkBall(r.other.refund,refBg,refFg,'sq',bsz);
        const extraLabelHtml=hasE&&game.extra_name
          ?`<span style="font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--text2);text-transform:uppercase;letter-spacing:1px;white-space:nowrap;flex-shrink:0">${esc(game.extra_name)}</span>`:'';
        const codeAHtml=hasCA&&r.other?.code_a?.length
          ?`<span style="display:inline-flex;align-items:center;gap:4px;font-family:var(--font-ui);font-size:var(--fs-xs);font-weight:600;background:rgba(39,201,122,.12);border:1px solid rgba(39,201,122,.3);border-radius:4px;padding:1px 6px;white-space:nowrap"><span style="color:var(--text2)">${esc(game.code_a_name||'Código')}</span><span style="color:var(--success)">${esc(r.other.code_a[0])}</span></span>`:'';
        const ds=ri<draws.length-1?`border-bottom:1px solid var(--border);margin-bottom:${drawMB};padding-bottom:${drawPB};`:'';
        bodyHtml+=`<div style="${ds}"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${headerMB};gap:4px"><span style="font-family:var(--font-ui);font-size:var(--fs-sm);font-weight:600;color:var(--text2);white-space:nowrap">${esc(fdStr)}</span>${codeAHtml}${extraLabelHtml}</div>${brow(row,nMain,nExtra,nComp,nRef)}</div>`;
      });
    } else if(gt==='match'){
      const r=draws[draws.length-1]||{};
      const betArr=Array.isArray(r.bet)?r.bet:[];
      const matches=r.other?.matches||[];
      const fd=new Date(r.date+'T12:00:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
      bodyHtml+=`<div style="font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--muted);margin-bottom:3px">${esc(fd)}</div>`;
      const rowCount=betArr.length||15;
      const rowFs=rowCount>14?'var(--fs-xs)':'var(--fs-sm)';
      const rowPad=rowCount>14?'1px 0':'2px 0';
      betArr.forEach((res,idx)=>{
        const m=matches.find(x=>parseInt(x.position)===idx+1)||{};
        const rc=res==='1'?'#2563eb':res==='2'?'#dc2626':res.startsWith('M')?'#16a34a':'#ca8a04';
        const ds=idx<betArr.length-1?'border-bottom:1px solid var(--border)':'';
        bodyHtml+=`<div style="display:flex;align-items:center;justify-content:space-between;gap:3px;padding:${rowPad};${ds}"><div style="font-family:var(--font-ui);font-size:${rowFs};color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0">${esc(m.team_1_name||'Eq'+(idx*2+1))}<span style="color:var(--muted)"> - </span>${esc(m.team_2_name||'Eq'+(idx*2+2))}</div><span style="background:${rc};color:#fff;border-radius:3px;padding:1px 5px;font-family:var(--font-ui);font-size:${rowFs};font-weight:700;flex-shrink:0">${esc(res)}</span></div>`;
      });
    } else if(gt==='nacional'){
      bodyHtml+=`<div style="display:flex;gap:8px;height:100%">`;
      draws.forEach((r,ri)=>{
        const fd=new Date(r.date+'T12:00:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
        const betObj=r.bet&&!Array.isArray(r.bet)?r.bet:{P1:r.bet};
        const refunds=Array.isArray(r.other?.num_refund)?r.other.num_refund:(r.other?.num_refund!=null?[r.other.num_refund]:[]);
        const ds=ri<draws.length-1?'border-right:1px solid var(--border);padding-right:0.1px;':'';
        const numEntries=[];
        Object.keys(betObj).forEach((key,ki)=>{
          const nums=Array.isArray(betObj[key])?betObj[key]:[betObj[key]];
          nums.forEach((n,ni)=>numEntries.push({ord:ki===0&&ni===0?'1º':ki===0&&ni===1?'2º':ki===1?'2º':'',n}));
        });
        const crowded=numEntries.length+(refunds.length?1:0)>3;
        // CANTIDAD DE ESPACIO QUE OCUPA UN DÍA FRENTE AL OTRO EN EL BLOQUE. (0.9/1.1)
        bodyHtml+=`<div style="flex:${ri===0?0.95:1.05};min-width:0;display:flex;flex-direction:column;gap:4px;${ds}">`;
        bodyHtml+=`<div style="font-family:var(--font-ui);font-size:var(--fs-sm);font-weight:600;color:var(--text2)">${esc(fd)}</div>`;
        // MARGENES Y TAMAÑO DEL CONTENIDO DEL BLOQUE
        const rowGap=crowded?'3px':'5px', numPad=crowded?'2px 4px':'2px 7px', numFs=crowded?'var(--fs-lg)':'var(--fs-lg)', dividerH=crowded?'20px':'28px', refBallSz=crowded?18:20;
        bodyHtml+=`<div style="display:flex;align-items:center;gap:${rowGap};flex-wrap:nowrap">`;
        numEntries.forEach(({ord,n},idx)=>{
          bodyHtml+=`<div style="text-align:center;flex-shrink:0"><div style="font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--text2);margin-bottom:1px;font-weight:600">${ord} Premio</div><div style="background:${numBg};color:${numFg};border-radius:5px;padding:${numPad};font-family:var(--font-display);font-size:${numFs};letter-spacing:2px;white-space:nowrap">${esc(n)}</div></div>`;
          if(idx<numEntries.length-1&&refunds.length) bodyHtml+=`<div style="width:1px;height:${dividerH};background:var(--border);flex-shrink:0;margin:0 2px"></div>`;
        });
        if(refunds.length){
          bodyHtml+=`<div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0"><div style="font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--text2);margin-bottom:2px;font-weight:600">Reint.</div><div style="display:flex;gap:2px">`;
          refunds.forEach(rv=>bodyHtml+=mkBall(rv,refBg,refFg,'sq',refBallSz));
          bodyHtml+=`</div></div>`;
        }
        bodyHtml+=`</div></div>`;
      });
      bodyHtml+=`</div>`;
    }
    return{barClr,logoSrc,name:game.name||'Juego '+gameId,bodyHtml};
  }

  function makeBlock(gameId,draws,availW){
    const{barClr,logoSrc,name,bodyHtml}=buildBlockHTML(gameId,draws||[],availW||200);
    const hasPending=!draws||!draws.length;
    const block=document.createElement('div');
    block.className='result-block'+(hasPending?' result-pending':'');
    block.dataset.gameId=gameId;
    block.innerHTML=`
      <div class="result-block-header">
        <div class="result-block-bar" style="background:${barClr}"></div>
        ${logoSrc?`<img class="result-block-logo" src="${esc(logoSrc)}" alt="" onerror="hideImg(this)">` :''}
        <div class="result-block-name">${esc(name)}</div>
        ${hasPending?`<span style="font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--muted);margin-left:auto;opacity:.6">PENDIENTE</span>`:''}
      </div>
      <div class="rb-body">${bodyHtml}</div>`;
    return block;
  }

function colWrap(gcol,grow){
  const d=document.createElement('div');
  d.style.cssText=`display:flex;flex-direction:column;gap:clamp(6px,.8vw,10px);grid-column:${gcol};grid-row:${grow};overflow:hidden;min-height:0;`;

}

function _renderResults(data,grid,forceVertical){
  grid.innerHTML='';
  const isV=forceVertical||document.body.classList.contains('orient-v');
  const byGame={};
  (data||[]).forEach(r=>{
    if(!gamesMap[r.id_game]) return;
    if(!byGame[r.id_game]) byGame[r.id_game]=[];
    byGame[r.id_game].push(r);
  });
  Object.values(byGame).forEach(arr=>arr.sort((a,b)=>a.date>b.date?1:-1));
  const COL_ORDER={'1':[1,3,43,5],'2':[2],'3':[4],'4':[25,26],'b':[7,21]};
  const cols={'1':[],'2':[],'3':[],'4':[],'b':[]};
  Object.keys(COL_ORDER).forEach(col=>COL_ORDER[col].forEach(id=>{if(gamesMap[id])cols[col].push(id);}));
  const knownIds=[1,3,43,2,5,4,25,26,7,21];
  Object.keys(gamesMap).forEach(id=>{const iid=parseInt(id);if(!knownIds.includes(iid)&&!cols['1'].includes(iid))cols['1'].push(iid);});

  if(isV){
    grid.style.cssText='display:flex;flex-direction:column;gap:clamp(5px,.6vw,8px);overflow:hidden;height:100%';
    [...cols['1'],...cols['2'],...cols['3'],...cols['4'],...cols['b']].forEach(id=>{
      const b=makeBlock(id,byGame[id]);b.style.flex='1';b.style.minHeight='0';grid.appendChild(b);
    });
    requestAnimationFrame(()=>grid.querySelectorAll('.result-block').forEach(recalcBallsInBlock));
    return;
  }

  grid.style.cssText='display:grid;grid-template-columns:1fr 1fr 1fr 210px;grid-template-rows:1fr auto;gap:clamp(6px,.8vw,10px);height:100%;overflow:hidden;box-sizing:border-box;';

  function colWrap(gcol,grow){
    const d=document.createElement('div');
    d.style.cssText=`display:flex;flex-direction:column;gap:clamp(6px,.8vw,10px);grid-column:${gcol};grid-row:${grow};overflow:hidden;min-height:0;`;
    return d;
  }
  const c1=colWrap('1','1');grid.appendChild(c1);
  const FLEX_COL1={1:1.02,3:1,5:0.6}; // AJUSTAR BLOQUE Euromillon (1), EuroDreams (3) y el Gordo de la Primitiva (5).
  cols['1'].forEach(id=>{const b=makeBlock(id,byGame[id]);b.style.flex=String(FLEX_COL1[id]||1);b.style.minHeight='0';c1.appendChild(b);});
  const c2=colWrap('2','1');grid.appendChild(c2);
  cols['2'].forEach(id=>{const b=makeBlock(id,byGame[id]);b.style.flex='1';b.style.minHeight='0';c2.appendChild(b);});
  const qgBlock=makeQuiniGolBlock(byGame[26]||[]);
  qgBlock.style.flex='1';qgBlock.style.minHeight='0';c2.appendChild(qgBlock);
  const c3=colWrap('3','1/3');grid.appendChild(c3);
  cols['3'].forEach(id=>{const b=makeBlock(id,byGame[id]);b.style.flex='2.7';b.style.minHeight='0';c3.appendChild(b);});
  const ltId=cols['b'].find(id=>id===21);
  if(ltId!=null){const bl=makeBlock(ltId,byGame[ltId]);bl.style.flex='1.1';bl.style.minHeight='0';c3.appendChild(bl);}
  const c4=colWrap('4','1/3');grid.appendChild(c4);
  const quiBlock=makeQuinielaBlock(byGame[25]||[]);
  quiBlock.style.flex='1';quiBlock.style.minHeight='0';c4.appendChild(quiBlock);
  const nacId=cols['b'].find(id=>id===7);
  if(nacId!=null){
    const bn=makeBlock(nacId,byGame[nacId]);
    bn.style.cssText='grid-column:1/3;grid-row:2;overflow:hidden;min-height:0;max-height:120px;';
    grid.appendChild(bn);
  }
  requestAnimationFrame(()=>grid.querySelectorAll('.result-block').forEach(recalcBallsInBlock));
  resultsObserver.disconnect();
  resultsObserver.observe(grid);
}

const resultsObserver=new ResizeObserver(()=>{
  document.querySelectorAll('#results-grid .result-block,#mixed-results-grid .result-block').forEach(recalcBallsInBlock);
});

function recalcBallsInBlock(block){
  const body=block.querySelector('.rb-body');
  if(!body) return;
  const availW=Math.max(100,body.clientWidth-16);
  block.querySelectorAll('.ball-row[data-main]').forEach(row=>{
    const nMain=parseInt(row.dataset.main||0),nExtra=parseInt(row.dataset.extra||0);
    const nComp=parseInt(row.dataset.comp||0),nRef=parseInt(row.dataset.ref||0);
    const total=nMain+nExtra+nComp+nRef;if(!total) return;
    const seps=(nExtra>0?1:0)+(nComp>0?1:0)+(nRef>0?1:0);
    const sz=Math.min(30,Math.max(18,Math.floor((availW-seps*12-(total-1)*2)/total)));
    const fs=Math.max(9,Math.round(sz*.55))+'px';
    row.querySelectorAll('.ball-sized').forEach(b=>{b.style.width=sz+'px';b.style.height=sz+'px';b.style.fontSize=fs;});
  });
}

// ── LA QUINIELA (bloque independiente, incluye Pleno al 15) ──
function makeQuinielaBlock(quiDraws){
  const gameQui=gamesMap[25]||{};
  let logoSrcQui='';
  if(gameQui.logo_official) logoSrcQui=gameQui.logo_official.startsWith('http')?gameQui.logo_official:LOGO_BASE+gameQui.logo_official;
  else if(gameQui.logo) logoSrcQui=gameQui.logo.startsWith('http')?gameQui.logo:LOGO_BASE+gameQui.logo;

  const rQui=quiDraws[quiDraws.length-1]||{};
  const betQui=Array.isArray(rQui.bet)?rQui.bet:[];
  const matchesQui=rQui.other?.matches||[];

  // Simplified Pleno al 15: position===15 directly
  const plenoMatch15=matchesQui.find(x=>parseInt(x.position)===15)||null;
  const plenoT1=plenoMatch15?String(plenoMatch15.team_1_name||''):'';
  const plenoT2=plenoMatch15?String(plenoMatch15.team_2_name||''):'';
  // Goals from r.extra array directly
  const plenoRaw=Array.isArray(rQui.extra)?rQui.extra:(rQui.extra!=null?[rQui.extra]:[]);
  const plenoG1=plenoRaw.length>0?String(plenoRaw[0]):null;
  const plenoG2=plenoRaw.length>1?String(plenoRaw[1]):null;
  const fd=rQui.date?new Date(rQui.date+'T12:00:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}):'';

  const rowPad='2px 0';
  function goalBadge(g){
    if(g===null||g==='') return '<span style="width:18px;flex-shrink:0"></span>';
    const bg=g==='M'?'#7c3aed':g==='0'?'#374151':'#16a34a';
    return `<span style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:14px;background:${bg};color:#fff;border-radius:3px;font-family:var(--font-ui);font-size:var(--fs-xs);font-weight:700;flex-shrink:0">${esc(g)}</span>`;

    const rc=res==='1'?'#2563eb':res==='2'?'#dc2626':'#ca8a04';
    return `<span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:22px;background:${rc};color:#fff;border-radius:4px;font-family:var(--font-ui);font-size:var(--fs-sm);font-weight:700;flex-shrink:0">${esc(res)}</span>`;

    bodyHtml='<div style="opacity:.25;font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--muted);font-style:italic">Pendiente</div>';
  } else {
    if(fd) bodyHtml+=`<div style="font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--muted);margin-bottom:3px">${esc(fd)}</div>`;
    betQui.forEach((resQui,idx)=>{
      const mQui=matchesQui.find(x=>parseInt(x.position)===idx+1)||{};
      const t1=esc(mQui.team_1_name||('Eq'+(idx*2+1)));
      const t2=esc(mQui.team_2_name||('Eq'+(idx*2+2)));
      const ds=idx<betQui.length-1?'border-bottom:1px solid var(--border)':'';
      bodyHtml+=`<div style="display:flex;align-items:center;gap:3px;padding:${rowPad};${ds}"><div style="flex:1;min-width:0;font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t1}<span style="color:var(--muted)"> - </span>${t2}</div>${quiBadge(resQui)}</div>`;
    });
    if(plenoG1!==null||plenoG2!==null){
      bodyHtml+=`<div style="margin-top:4px;padding-top:4px;border-top:2px solid var(--border);flex-shrink:0"><div style="font-family:var(--font-ui);font-size:var(--fs-xs);font-weight:700;color:var(--pv-primary);letter-spacing:.5px;margin-bottom:3px;text-transform:uppercase">Pleno al 15</div><div style="display:flex;align-items:center;justify-content:space-between;gap:6px"><div style="font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:center">${plenoT1?esc(plenoT1):'Equipo 1'}<span style="color:var(--muted);margin:0 4px">-</span>${plenoT2?esc(plenoT2):'Equipo 2'}</div><div style="display:flex;align-items:center;gap:3px;flex-shrink:0">${goalBadge(plenoG1)}<span style="font-family:var(--font-ui);font-size:var(--fs-xs);color:var(--muted)">-</span>${goalBadge(plenoG2)}</div></div></div>`;

// ── 10. RENDER — VISTA MIXTA ──────────────────────────────────
function renderMixedJackpots(data){
  const grid=document.getElementById('mixed-jackpots-grid');
  if(!grid) return;
  grid.innerHTML='';
  const items=data.filter(item=>!Object.keys(gamesMap).length||gamesMap[item.id_game]);
  if(!items.length) return;
  const n=items.length,cols=n<=3?1:2;
  grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  grid.style.gridTemplateRows=`repeat(${Math.ceil(n/cols)},1fr)`;
  const maxJ=Math.max(...items.map(i=>parseFloat(i.jackpot)||0));
  const minDate=items.reduce((m,i)=>(!i.date?m:(!m||i.date<m?i.date:m)),null);
  items.forEach((item,i)=>{
    const game=gamesMap[item.id_game]||{};
    const barClr=game.fg_color||game.bg_color||'var(--pv-primary)';
    const rawAmtClr=game.jackpot_fg_color||'';
    const amtClr=(rawAmtClr&&rawAmtClr!=='#000000'&&rawAmtClr!=='#FFFFFF'&&rawAmtClr!=='#ffffff'&&rawAmtClr!=='#000')?rawAmtClr:'var(--pv-primary)';
    const jackpot=parseFloat(item.jackpot)||0;
    const millones=jackpot/1000000;
    let amountHtml;
    if(jackpot>=1000000){
      const milStr=Number.isInteger(millones)?millones.toString():millones.toFixed(1).replace('.',',');
      amountHtml=`<span class="card-amount-number">${milStr}</span><span class="card-amount-label">${millones===1?'MILLÓN DE EUROS':'MILLONES DE EUROS'}</span>`;
    } else {
      amountHtml=`<span class="card-amount-number">${Math.floor(jackpot).toLocaleString('es-ES')}</span><span class="card-amount-label">EUROS</span>`;
    }
    let logoSrc='';
    if(game.logo_official) logoSrc=game.logo_official.startsWith('http')?game.logo_official:LOGO_BASE+game.logo_official;
    else if(game.logo) logoSrc=game.logo.startsWith('http')?game.logo:LOGO_BASE+game.logo;
    const card=document.createElement('div');
    card.className='jackpot-card'+(jackpot>0&&jackpot===maxJ?' is-highest':'')+(item.date&&item.date===minDate?' is-next':'');
    card.style.animationDelay=`${i*30}ms`;
    card.innerHTML=`<div class="card-bar" style="background:${barClr}"></div><div class="card-header">${logoSrc?`<img class="card-logo" src="${esc(logoSrc)}" alt="" onerror="hideImg(this)">`:''}<div class="card-name">${esc(item.name||game.name||'—')}</div></div><div class="card-amount-wrap"><div class="card-amount" style="color:${amtClr}">${amountHtml}</div></div>`;
    grid.appendChild(card);
  });
  requestAnimationFrame(()=>{
    grid.querySelectorAll('.card-amount').forEach(amt=>{
      const wrap=amt.closest('.card-amount-wrap');if(!wrap)return;
      let size=Math.min(wrap.clientHeight*.7,60);amt.style.fontSize=size+'px';
      while(amt.scrollWidth>wrap.clientWidth*.95&&size>14){size-=2;amt.style.fontSize=size+'px';}
    });
    const sizes=[...grid.querySelectorAll('.card-amount')].map(a=>parseFloat(a.style.fontSize)||60);
    if(sizes.length){const minS=Math.min(...sizes);grid.querySelectorAll('.card-amount').forEach(a=>a.style.fontSize=minS+'px');}
  });
}

// Vista mixta — el panel de Resultados es la MITAD de ancho de la vista de
// Resultados normal, así que no caben las 4 columnas a la vez. En vez de
// inventar un layout nuevo, se muestran las mismas columnas de siempre pero
// partidas en dos mitades que se turnan cada 2,5s:
//  Grupo 1 = columnas 1+2 (Euromillón/EuroDreams/Gordo/Nacional + Primitiva/QuiniGol)
//  Grupo 2 = columnas 3+4 (Bonoloto/LotoTurf + La Quiniela)
// Reutiliza paintResultsCols12()/paintResultsCols34(), las mismas que pinta la
// vista de Resultados — mismos pesos, mismos colores, semana completa.
let mixedResultsRotateTimer=null;
let mixedResultsGroupIdx=0;
const MIXED_RESULTS_ROTATE_MS=2500;

function stopMixedResultsRotate(){
  if(mixedResultsRotateTimer){clearInterval(mixedResultsRotateTimer);mixedResultsRotateTimer=null;}
}

function renderMixedResults(data){
  const grid=document.getElementById('mixed-results-grid');
  if(!grid) return;
  stopMixedResultsRotate();

  const byGame={};
  (data||[]).forEach(r=>{
    if(!gamesMap[r.id_game]) return;
    if(!byGame[r.id_game]) byGame[r.id_game]=[];
    byGame[r.id_game].push(r);
  });
  Object.values(byGame).forEach(arr=>arr.sort((a,b)=>a.date>b.date?1:-1));
  const COL_ORDER={'1':[1,3,43,5],'2':[2],'3':[4],'4':[25,26],'b':[7,21]};
  const cols={'1':[],'2':[],'3':[],'4':[],'b':[]};
  Object.keys(COL_ORDER).forEach(col=>COL_ORDER[col].forEach(id=>{if(gamesMap[id])cols[col].push(id);}));

  function paintGroup(idx){
    grid.innerHTML='';
    if(idx===0) paintResultsCols12(grid,byGame,cols);
    else paintResultsCols34(grid,byGame,cols);
    requestAnimationFrame(()=>grid.querySelectorAll('.result-block').forEach(recalcBallsInBlock));
    resultsObserver.disconnect();
    resultsObserver.observe(grid);
  }

  mixedResultsGroupIdx=0;
  paintGroup(0);
  mixedResultsRotateTimer=setInterval(()=>{
    mixedResultsGroupIdx=1-mixedResultsGroupIdx;
    paintGroup(mixedResultsGroupIdx);
  },MIXED_RESULTS_ROTATE_MS);
}

// ── 11. CAMBIO DE VISTA Y NAVEGACIÓN ──────────────────────────
function switchView(view){
  stopMixedResultsRotate();
  currentView=view;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  const tabEl=document.getElementById('tab-'+view);
  if(tabEl) tabEl.classList.add('active');
  const labelEl=document.getElementById('section-label-text');
  const wrapEl=document.getElementById('section-label-header');
  function setLabel(txt){if(labelEl)labelEl.textContent=txt||'';if(wrapEl)wrapEl.style.display=txt?'flex':'none';}
  if(view==='jackpots'){
    setLabel('Próximos Sorteos');
    if(lastJackpotsData.length) renderJackpots(lastJackpotsData);
  } else if(view==='results'){
    setLabel(resultsWeekLabel());
    if(lastResultsData.length) renderResults(lastResultsData);
    else if(Object.keys(gamesMap).length) fetchResults();
  } else if(view==='mixed'){
    setLabel('');
    if(lastJackpotsData.length) renderMixedJackpots(lastJackpotsData);
    if(lastResultsData.length) renderMixedResults(lastResultsData);
    else if(Object.keys(gamesMap).length) fetchResults();

  if(cfg.autoRotate && view!=='mixed') resetRotateBar(cfg);
}

// ── 12. AUTO-ROTACIÓN Y TEMPORIZADORES ────────────────────────
function startAutoRotate(cfg){
  stopAutoRotate();
  if(!cfg.autoRotate||currentView==='mixed') return;
  const ms=Math.max(10,Math.min(300,cfg.autoRotateInterval||30))*1000;
  resetRotateBar(cfg);
  autoRotateTimer=setInterval(()=>{
    if(document.getElementById('overlay').classList.contains('visible')) return;
    switchView(currentView==='jackpots'?'results':'jackpots');
  },ms);
}
function stopAutoRotate(){
  if(autoRotateTimer){clearInterval(autoRotateTimer);autoRotateTimer=null;}
  const bar=document.getElementById('rotate-bar');
  if(bar){bar.style.transition='none';bar.style.width='100%';bar.style.display='none';}
}
function resetRotateBar(cfg){
  const bar=document.getElementById('rotate-bar');
  if(!bar||!cfg.autoRotate) return;
  const secs=Math.max(10,Math.min(300,cfg.autoRotateInterval||30));
  bar.style.display='';bar.style.transition='none';bar.style.width='100%';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    bar.style.transition=`width ${secs}s linear`;bar.style.width='0%';
  }));
}
function setupTimers(cfg){
  Object.values(timers).forEach(clearInterval);timers={};
  if(cfg.refreshJackpots>0) timers.j=setInterval(()=>{fetchJackpots();fetchResults();},cfg.refreshJackpots*60000);
  if(cfg.refreshPvInfo>0) timers.p=setInterval(refreshPvAndGames,cfg.refreshPvInfo*3600000);
  startAutoRotate(cfg);
}

// ── 13. ORQUESTACIÓN DE CARGA INICIAL ──────────────────────────
async function loadAllData(){
  if(_booted){console.log('[boot] already booted');return;}
  if(_loadingInProgress){console.log('[boot] already running');return;}
  _booted=true;_loadingInProgress=true;
  showLoading(true);
  const cfg=loadConfig();
  try{
    setLoadingStep('Conectando pv-info...');
    await fetchPvInfo();
    setLoadingStep('Cargando juegos...');
    await fetchGames();
    setLoadingStep(cfg.demoMode?'Cargando resultados (DEMO)...':'Cargando datos...');
    await Promise.all([fetchJackpots(),fetchResults()]);
    setLoadingStep('Listo');
  }catch(e){
    console.error('[boot] loadAllData error:',e);
    setLoadingStep('ERROR: '+e.message);
    await new Promise(r=>setTimeout(r,5000));
  }
  showLoading(false);
  _loadingInProgress=false;
  switchView(currentView||'jackpots');
  startAutoRotate(cfg);
}
async function refreshPvAndGames(){await fetchPvInfo();await fetchGames();}

// ── 14. DIAGNÓSTICO ───────────────────────────────────────────
async function diagRunGameResults(){
  diagClear();const cfg=loadConfig();const gameIds=Object.keys(gamesMap);
  if(!gameIds.length){diagLog('ERROR: gamesMap vacío — ejecuta get-games primero','#e05c2a');return;}

  for(const id of gameIds){
    const game=gamesMap[id]||{};

    try{
      const t0=Date.now();
      const body={token:cfg.token,pass:cfg.pass,app_id:cfg.appid,id_game:parseInt(id),limit:7};
      const resp=await fetch(`${cfg.url}/ws/last-game-results`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const ms=Date.now()-t0,text=await resp.text();
      diagLog(`   HTTP ${resp.status} en ${ms}ms`,resp.ok?'#27c97a':'#e05c2a');
      try{
        const json=JSON.parse(text),results=json.data||[];
        diagLog(`   Resultados: ${Array.isArray(results)?results.length:JSON.stringify(results).substring(0,80)}`,'#b0ccd8');
        if(Array.isArray(results)&&results.length) results.forEach(r=>diagLog(`   ${r.date} is_confirmed:${r.is_confirmed} bet:${JSON.stringify(r.bet).substring(0,60)}`,'#8ab4c8'));
      }catch{diagLog(`   Raw: ${text.substring(0,200)}`,'#b0ccd8');}
    }catch(e){diagLog(`   ERROR: ${e.message}`,'#e05c2a');}
  }
  diagLog('✓ Diagnóstico completado','#27c97a');
}
function diagCopyLog(){
  const el=document.getElementById('diag-output');
  const text=[...el.querySelectorAll('div')].map(d=>d.textContent).join('\n');
  navigator.clipboard.writeText(text).then(()=>{const btn=event.target,orig=btn.textContent;btn.textContent='✓ Copiado';setTimeout(()=>btn.textContent=orig,2000);})
  .catch(()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);const btn=event.target,orig=btn.textContent;btn.textContent='✓ Copiado';setTimeout(()=>btn.textContent=orig,2000);});
}
function diagLog(m,c){const el=document.getElementById('diag-output'),l=document.createElement('div');l.style.color=c||'#8ab4c8';l.textContent=m;el.appendChild(l);el.scrollTop=el.scrollHeight;}
function diagClear(){document.getElementById('diag-output').innerHTML='';}
async function diagRun(endpoint){
  diagClear();const cfg=loadConfig();
  diagLog(`► Llamada directa: ${cfg.url}/ws/${endpoint}`,'#f0b429');
  diagLog(`  token:  ${cfg.token}`,'#5a7a8e');
  diagLog(`  pass:   ${'•'.repeat(cfg.pass.length)}`,'#5a7a8e');
  diagLog(`  app_id: ${cfg.appid}`,'#5a7a8e');
  diagLog('Enviando petición...','#3a5a6e');
  try{
    const body={token:cfg.token,pass:cfg.pass,app_id:cfg.appid};
    const t0=Date.now();
    const resp=await fetch(`${cfg.url}/ws/${endpoint}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const ms=Date.now()-t0,text=await resp.text();
    diagLog(`✓ Respuesta en ${ms}ms — HTTP ${resp.status}`,resp.ok?'#27c97a':'#e05c2a');diagLog('','');
    try{
      const json=JSON.parse(text),lines=JSON.stringify(json,null,2).split('\n'),MAX=120;
      lines.slice(0,MAX).forEach(l=>diagLog(l,'#b0ccd8'));
      if(lines.length>MAX) diagLog(`... (${lines.length-MAX} líneas más en consola)`,'#3a5a6e');
      console.log(`[Diag] ${endpoint}:`,json);
    }catch{diagLog(text.substring(0,2000),'#b0ccd8');}
  }catch(e){diagLog(`✗ Error: ${e.message}`,'#e05c2a');}
}

// ── 15. ARRANQUE (BOOT) ───────────────────────────────────────
(function purgeOldKeys(){
  try{Object.keys(localStorage).forEach(function(k){if(k.startsWith('infolot_cfg_')&&k!==STORAGE_KEY){localStorage.removeItem(k);console.log('[boot] purged old key:',k);}});}catch(e){}
})();

(function boot(){
  const cfg=loadConfig();
  if(cfg.orient===null){cfg.orient=detectOrientation();persistConfig(cfg);}
  applyTheme(cfg.theme);applyOrientation(cfg.orient);applyBrandColors(cfg.color1,cfg.color2);applyPvUrl(cfg.pvurl);
  updateDemoBadge(cfg);
  document.getElementById('app-ver').textContent=`v${APP_VERSION} · r${APP_REVISION}`;
  updateClock();setInterval(updateClock,30000);
  setupTimers(cfg);
  if(cfg.defaultView&&cfg.defaultView!=='jackpots'){
    currentView=cfg.defaultView;
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    const vEl=document.getElementById('view-'+cfg.defaultView);
    if(vEl) vEl.classList.add('active');
  }
  loadAllData();
})();
</script>
