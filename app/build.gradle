plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'es.infolot.tv'
    compileSdk 34

    defaultConfig {
        applicationId "es.infolot.tv"
        minSdk 23          // EncryptedSharedPreferences requiere mínimo API 23
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // EncryptedSharedPreferences para almacenamiento seguro de credenciales
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Corrutinas para el polling de activación
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
