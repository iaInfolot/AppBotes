plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'es.infolot.tv'
    compileSdk 35

    defaultConfig {
        applicationId "es.infolot.tv"
        minSdk 21
        targetSdk 35
        versionCode 3
        versionName "1.5.0"
    }

    buildFeatures {
        buildConfig true
    }

    // Dos variantes del mismo código: "tv" (cajas Android TV, mando a
    // distancia, orientación simulada por CSS porque el hardware no gira de
    // verdad) y "tablet" (pantalla táctil, rota de verdad con el sensor).
    // screenOrientation se resuelve vía manifest placeholder según el flavor
    // (ver AndroidManifest.xml); DEVICE_TYPE se manda al WebView como
    // parámetro de URL para que infolot-tv-app.html sepa en qué variante
    // corre (ver MainActivity.APP_URL / IS_TV en el HTML).
    flavorDimensions "device"
    productFlavors {
        tv {
            dimension "device"
            buildConfigField "String", "DEVICE_TYPE", '"tv"'
            manifestPlaceholders = [screenOrientation: "landscape"]
        }
        tablet {
            dimension "device"
            applicationId "es.infolot.tv.tablet"
            versionCode 1
            versionName "1.0.0"
            buildConfigField "String", "DEVICE_TYPE", '"tablet"'
            manifestPlaceholders = [screenOrientation: "unspecified"]
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
