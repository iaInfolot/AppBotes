plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'es.infolot.tv'
    compileSdk 34

    defaultConfig {
        applicationId "es.infolot.tv"
        minSdk 21          // Android 5.0+ — covers all modern TVs and tablets
        targetSdk 34
        versionCode 1
        versionName "1.4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
